<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalku</title>
<meta name="description" content="Kalku : six nombres, trois cibles, quatre opérations. Un casse-tête quotidien sans mots, un mode Blitz, Bip, une roulette et des trophées.">
<meta property="og:title" content="Kalku">
<meta property="og:description" content="Six nombres, trois cibles, quatre opérations. Le même puzzle pour tout le monde, chaque jour.">
<meta name="theme-color" content="#2540FF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalku">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<style>
@property --hue { syntax:"<number>"; inherits:true; initial-value:14; }
:root{
  --hue:14;
  --bg:#FAF8FF; --panel:#FFFFFF; --ink:#1B1740; --soft:#6B6790; --line:#E6E3F3;
  --accent:hsl(var(--hue) 85% 52%); --accent-2:hsl(calc(var(--hue) + 40) 90% 56%); --accent-ink:#FFFFFF;
  --tile:#FFFFFF; --tile-edge:hsl(var(--hue) 70% 86%); --tile-glow:hsl(var(--hue) 70% 60% / .22);
  --op:hsl(var(--hue) 90% 95%); --op-ink:hsl(var(--hue) 70% 32%);
  --star:#FFB300; --star-off:#DCD9EA; --ok:#12B76A; --bad:#F04438; --focus:hsl(var(--hue) 85% 45%); --coin:#F5A524; --gem:#4FC3F7; --ticket:#FF7043;
  --blob-a:hsl(var(--hue) 95% 78%); --blob-b:hsl(calc(var(--hue) + 120) 90% 82%); --blob-c:hsl(calc(var(--hue) + 240) 90% 85%);
  --face:#1B1740; --scrim:rgba(27,23,64,.5); --radius:1.25rem; --radius-s:1rem;
  --bronze:#CD7F32; --silver:#9FB4C7; --gold:#FFC107; --diamond:#7DE3FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-board]){
    --bg:#0B0A1F; --panel:#171538; --ink:#F4F2FF; --soft:#A29FCB; --line:#2B2955;
    --accent:hsl(var(--hue) 85% 62%); --accent-2:hsl(calc(var(--hue) + 40) 90% 64%); --accent-ink:#0B0A1F;
    --tile:#1B1945; --tile-edge:hsl(var(--hue) 55% 24%); --tile-glow:hsl(var(--hue) 90% 55% / .35);
    --op:hsl(var(--hue) 50% 18%); --op-ink:hsl(var(--hue) 90% 80%);
    --star:#FFD54F; --star-off:#332F6B; --ok:#3ECF8E; --bad:#FF6B61; --focus:hsl(var(--hue) 85% 70%); --coin:#FFC64D;
    --blob-a:hsl(var(--hue) 90% 40%); --blob-b:hsl(calc(var(--hue) + 120) 80% 35%); --blob-c:hsl(calc(var(--hue) + 240) 80% 38%);
    --face:#0B0A1F; --scrim:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]:not([data-board]){
  --bg:#0B0A1F; --panel:#171538; --ink:#F4F2FF; --soft:#A29FCB; --line:#2B2955;
  --accent:hsl(var(--hue) 85% 62%); --accent-2:hsl(calc(var(--hue) + 40) 90% 64%); --accent-ink:#0B0A1F;
  --tile:#1B1945; --tile-edge:hsl(var(--hue) 55% 24%); --tile-glow:hsl(var(--hue) 90% 55% / .35);
  --op:hsl(var(--hue) 50% 18%); --op-ink:hsl(var(--hue) 90% 80%);
  --star:#FFD54F; --star-off:#332F6B; --ok:#3ECF8E; --bad:#FF6B61; --focus:hsl(var(--hue) 85% 70%); --coin:#FFC64D;
  --blob-a:hsl(var(--hue) 90% 40%); --blob-b:hsl(calc(var(--hue) + 120) 80% 35%); --blob-c:hsl(calc(var(--hue) + 240) 80% 38%);
  --face:#0B0A1F; --scrim:rgba(0,0,0,.62);
}
/* Thèmes de plateau (forcés, quel que soit le mode du téléphone) */
:root[data-board="ocean"]{--bg:#E3F6FF;--panel:#FFFFFF;--ink:#0B2E4A;--soft:#4F7A95;--line:#C9E6F5;--tile:#FFFFFF;--tile-edge:#9ADBF5;--tile-glow:rgba(0,150,220,.22);--op:#DDF3FF;--op-ink:#0B5F8A;--blob-a:#7FD3FF;--blob-b:#B3F0E0;--blob-c:#CFE9FF;--face:#0B2E4A;--star-off:#CFE3EE}
:root[data-board="sakura"]{--bg:#FFF0F5;--panel:#FFFFFF;--ink:#4A1F33;--soft:#9A5C77;--line:#F5D3E1;--tile:#FFFFFF;--tile-edge:#F7B8D2;--tile-glow:rgba(240,100,160,.22);--op:#FFE1EC;--op-ink:#A7325F;--blob-a:#FFB7D5;--blob-b:#FFE0B2;--blob-c:#E1BEE7;--face:#4A1F33;--star-off:#F0D6E1}
:root[data-board="forest"]{--bg:#F3EBDD;--panel:#FFF8EC;--ink:#3E2A14;--soft:#7A6247;--line:#E3D4BA;--tile:#F2DDB9;--tile-edge:#C89B5E;--tile-glow:rgba(120,80,20,.22);--op:#E4EFD8;--op-ink:#2E5A1E;--blob-a:#A5D6A7;--blob-b:#D7CCC8;--blob-c:#FFE0B2;--face:#3E2A14;--star-off:#E0D2BA}
:root[data-board="night"]{--bg:#0B0F1F;--panel:#141A33;--ink:#EAF0FF;--soft:#9AA6D6;--line:#26305A;--tile:#1A2142;--tile-edge:#2B3A80;--tile-glow:rgba(0,229,255,.35);--op:#1B2B4F;--op-ink:#7FF0FF;--accent:#00E5FF;--accent-2:#FF3DAB;--accent-ink:#0B0F1F;--blob-a:#00E5FF;--blob-b:#FF3DAB;--blob-c:#7C4DFF;--face:#0B0F1F;--scrim:rgba(0,0,0,.7);--coin:#FFD54F;--star-off:#2B3560;--focus:#00E5FF}
:root[data-board="retro"]{--bg:#000000;--panel:#111111;--ink:#E6FF6A;--soft:#9FB36B;--line:#333333;--tile:#1B1B1B;--tile-edge:#4A4A4A;--tile-glow:rgba(230,255,106,.25);--op:#1F2A12;--op-ink:#E6FF6A;--accent:#E6FF6A;--accent-2:#FF6AE6;--accent-ink:#000000;--blob-a:#1F3A1F;--blob-b:#3A1F3A;--blob-c:#1F1F3A;--face:#000000;--scrim:rgba(0,0,0,.75);--star:#FFE06A;--star-off:#3A3A3A;--coin:#FFE06A;--focus:#E6FF6A;--radius:.4rem;--radius-s:.35rem}
:root[data-board="royal"]{--bg:#1A0F2E;--panel:#2A1A4A;--ink:#FFF3D6;--soft:#C9B8E8;--line:#3F2B6E;--tile:#3A2565;--tile-edge:#7D5AA6;--tile-glow:rgba(255,193,7,.3);--op:#3B2A5F;--op-ink:#FFD54F;--accent:#FFC107;--accent-2:#FF8F00;--accent-ink:#1A0F2E;--blob-a:#FFC107;--blob-b:#7C4DFF;--blob-c:#4A148C;--face:#1A0F2E;--scrim:rgba(0,0,0,.7);--star-off:#4A3A70;--focus:#FFC107}
:root[data-board="galaxy"]{--bg:#05030F;--panel:#100A24;--ink:#EDE7FF;--soft:#A99BD9;--line:#241A4A;--tile:#160F33;--tile-edge:#3B2A7A;--tile-glow:rgba(124,77,255,.4);--op:#1B1240;--op-ink:#C9B8FF;--accent:#7C4DFF;--accent-2:#FF3DAB;--accent-ink:#FFFFFF;--blob-a:#7C4DFF;--blob-b:#FF3DAB;--blob-c:#1DE9B6;--face:#05030F;--scrim:rgba(0,0,0,.75);--star-off:#2A2050;--focus:#7C4DFF}
:root[data-board="night"] .blob,:root[data-board="galaxy"] .blob,:root[data-board="royal"] .blob{opacity:.5}
:root[data-board="retro"] .blob{opacity:.6;filter:blur(40px)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35;min-height:100dvh;overflow-x:hidden;transition:--hue .8s ease,background-color .5s}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none !important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* Fond vivant + particules */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.75;will-change:transform}
.b1{background:var(--blob-a);left:-25vmax;top:-30vmax;animation:drift1 22s ease-in-out infinite alternate}
.b2{background:var(--blob-b);right:-30vmax;top:20vh;animation:drift2 26s ease-in-out infinite alternate}
.b3{background:var(--blob-c);left:10vw;bottom:-40vmax;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,-12vh) scale(.9)}}
@keyframes drift3{to{transform:translate(-10vw,-18vh) scale(1.1)}}
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.pt{position:absolute;bottom:-10vh;left:var(--x);width:var(--s);height:var(--s);opacity:0;animation-duration:var(--d);animation-delay:var(--dl);animation-iteration-count:infinite;animation-timing-function:linear}
.pt.bubble{border-radius:50%;border:2px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(120,210,255,.2));animation-name:rise}
.pt.petal{border-radius:60% 0 60% 0;background:linear-gradient(135deg,#FFC1D9,#FF8FB8);top:-10vh;bottom:auto;animation-name:fall}
.pt.leaf{border-radius:0 60% 0 60%;background:linear-gradient(135deg,#8BC34A,#558B2F);top:-10vh;bottom:auto;animation-name:fall}
.pt.star{border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;top:var(--y);bottom:auto;animation-name:twinkle;animation-timing-function:ease-in-out}
.pt.sparkle{background:var(--accent);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);top:var(--y);bottom:auto;animation-name:twinkle}
.pt.grid{inset:0;left:0;bottom:0;width:100%;height:100%;opacity:.25;background:linear-gradient(transparent 95%,var(--accent) 95%) 0 0/100% 40px,linear-gradient(90deg,transparent 95%,var(--accent-2) 95%) 0 0/40px 100%;animation-name:gridmove;animation-timing-function:linear}
.pt.scan{inset:0;left:0;bottom:0;width:100%;height:100%;opacity:.18;background:repeating-linear-gradient(transparent 0 3px,rgba(230,255,106,.35) 3px 4px);animation-name:scanmove;animation-timing-function:linear}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}90%{opacity:.6}100%{transform:translateY(-115vh) translateX(6vw);opacity:0}}
@keyframes fall{0%{transform:translateY(0) rotate(0) translateX(0);opacity:0}10%{opacity:.95}50%{transform:translateY(55vh) rotate(180deg) translateX(8vw)}100%{transform:translateY(115vh) rotate(360deg) translateX(-6vw);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes gridmove{to{background-position:0 40px,40px 0}}
@keyframes scanmove{to{background-position:0 4px}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.flash{position:fixed;inset:0;pointer-events:none;z-index:8;background:var(--accent);opacity:0}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}

/* Écrans */
.screen{max-width:26rem;margin:0 auto;min-height:100dvh;padding:calc(.7rem + env(safe-area-inset-top)) .9rem calc(.8rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.55rem}
.screen.enter{animation:screenin .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenin{0%{opacity:0;transform:translateY(14px) scale(.98)}100%{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:2.6rem}
.topbar .mid{flex:1;text-align:center;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums;font-size:.95rem}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:.8rem;height:2.5rem;min-width:2.5rem;padding:0 .6rem;font-size:1rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.icon[aria-pressed="false"]{opacity:.55}
.cur{display:inline-flex;align-items:center;gap:.25rem;font-weight:800}
.cur.coins b{color:var(--coin)}.cur.gems b{color:var(--gem)}.cur.tix b{color:var(--ticket)}
.icon svg,.cur svg,.float svg{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em}
.cur b{display:inline-flex;align-items:center}
.strip .cur{cursor:pointer}
.coins.bump,.gems.bump,.tix.bump{animation:bump .5s cubic-bezier(.3,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.18)}}
.float{position:fixed;font-weight:800;color:var(--coin);pointer-events:none;z-index:11;animation:floatup 1.2s ease-out both;text-shadow:0 2px 10px rgba(0,0,0,.25)}
@keyframes floatup{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-40px) scale(1)}}

/* Accueil */
.home .logo{text-align:center;margin:.3rem 0 0}
.home .logo h1{margin:0;font-size:clamp(2.6rem,13vw,3.6rem);font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(90deg,var(--ink) 0 40%,var(--accent) 50%,var(--ink) 60% 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
.home .logo p{margin:.1rem 0 0;color:var(--soft);font-weight:600;font-size:.92rem}
.stage{position:relative;min-height:clamp(7.5rem,21dvh,9.5rem);display:flex;align-items:center;gap:.7rem;padding:.2rem .15rem}
#hDecor{position:absolute;inset:0;z-index:0;pointer-events:none}
.stage .slot{width:clamp(5.6rem,17dvh,7.4rem);height:clamp(6.2rem,19dvh,8.2rem);display:grid;place-items:center;filter:drop-shadow(0 18px 30px var(--tile-glow));flex:none;z-index:1}
.stage .slot .bip{width:100%;height:100%}
.decor{position:absolute;font-size:1.7rem;line-height:1;animation:hover 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
@keyframes hover{50%{transform:translateY(-6px)}}
.hbubble{position:relative;flex:1;z-index:2;background:var(--panel);border-radius:1.1rem;padding:.65rem .85rem;font-weight:600;font-size:.92rem;line-height:1.3;box-shadow:0 10px 24px var(--tile-glow);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s,transform .25s;text-align:left;min-height:2.6rem;cursor:pointer}
.hbubble::before{content:"";position:absolute;left:-8px;bottom:16px;border:8px solid transparent;border-right-color:var(--panel);border-left:0}
.hbubble.show{opacity:1;transform:none}
.pro .hbubble{position:absolute;top:-.7rem;left:5.6rem;right:.6rem;flex:none;z-index:3;font-size:.85rem;padding:.5rem .7rem}
.pro .hbubble::before{left:-8px;bottom:12px}
.pcard{display:flex;align-items:center;gap:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.55rem .75rem;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.pcard .ring{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem;color:var(--accent-ink);background:conic-gradient(var(--accent) var(--p,0%),var(--line) 0);position:relative;flex:none}
.pcard .ring::after{content:attr(data-lv);position:absolute;inset:.3rem;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center}
.pcard .who{flex:1;min-width:0}
.pcard .who b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .who span{color:var(--soft);font-size:.88rem;font-weight:600}
.pcard .wallet{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem;font-size:.92rem}
.menu{display:grid;gap:.55rem}
.big{display:flex;align-items:center;justify-content:space-between;gap:.6rem;border:0;border-radius:var(--radius);padding:.9rem 1rem;text-align:left;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 12px 28px var(--tile-glow);transition:transform .12s}
.big:active{transform:scale(.98)}
.big b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.big small{display:block;font-weight:600;opacity:.9;font-size:.9rem}
.big .ico{font-size:1.8rem;line-height:1}
.big.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.big.alt small{color:var(--soft)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.55rem}
.sq{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:.7rem .3rem .6rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:.3rem;box-shadow:0 8px 20px rgba(0,0,0,.06);transition:transform .12s;font-size:.9rem}
.sq:active{transform:scale(.97)}
.sq .ico{font-size:1.6rem;line-height:1}
.sq .badge{position:absolute;top:-.45rem;right:-.35rem;z-index:2;background:var(--ticket);color:#fff;border-radius:999px;min-width:1.4rem;height:1.4rem;display:grid;place-items:center;font-size:.8rem;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.foot{display:flex;justify-content:center;gap:.5rem;color:var(--soft);font-size:.85rem;font-weight:600}

/* Jeu : tout en un écran */
.game{gap:.4rem}
.xp{display:flex;align-items:center;gap:.5rem;font-weight:600;color:var(--soft);font-size:.85rem}
.xp .lv{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-radius:.6rem;padding:.1rem .5rem;font-weight:800;font-size:.85rem}
.xp .track{flex:1;height:.4rem;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.xp .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-weight:600;color:var(--soft);font-size:.9rem}
.hud b{color:var(--ink);font-size:1.1rem;font-weight:800}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem}
.bar{height:.5rem;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .1s linear;border-radius:999px}
.bar.low i{background:var(--bad);animation:blinkbar .5s steps(2) infinite}
@keyframes blinkbar{to{opacity:.55}}
.target{text-align:center;padding:0}
.tlabel{margin:0;color:var(--soft);font-weight:600;font-size:.9rem}
.tnum{margin:0;font-size:clamp(3.4rem,11dvh,5.6rem);font-weight:800;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 40px var(--tile-glow);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{text-shadow:0 0 70px var(--tile-glow),0 0 20px var(--tile-glow)}}
.tnum.roll{animation:roll .5s cubic-bezier(.2,.8,.2,1),breathe 3s ease-in-out .5s infinite}
.tnum.hit{color:var(--ok);animation:hitpulse .6s ease-out}
@keyframes roll{from{transform:translateY(.35em) scale(.9);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
@keyframes hitpulse{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
.path{display:flex;align-items:flex-start;justify-content:center;margin:.1rem auto 0;max-width:14rem}
.node{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-weight:800}
.node b{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);color:var(--soft);font-size:.9rem;transition:background-color .3s,color .3s,transform .3s}
.node:not(:first-child)::before{content:"";position:absolute;left:-50%;right:50%;top:.9rem;height:3px;background:var(--line);z-index:-1}
.node.done::before,.node.cur::before{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.node.done b{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent}
.node.cur b{background:var(--accent);color:var(--accent-ink);border-color:transparent;transform:scale(1.15);box-shadow:0 0 0 5px var(--tile-glow);animation:nodepulse 1.6s ease-in-out infinite}
@keyframes nodepulse{50%{box-shadow:0 0 0 10px var(--tile-glow)}}
.node .ns{font-size:.85rem;letter-spacing:.04em;line-height:1;min-height:.9rem}
.on{color:var(--star);display:inline-block}
.off{color:var(--star-off)}
.node.earn .on{animation:earn .6s cubic-bezier(.3,1.6,.4,1) both}
.node.earn .on:nth-child(2){animation-delay:.1s}
.node.earn .on:nth-child(3){animation-delay:.2s}
@keyframes earn{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.4) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.bip-row{display:flex;align-items:flex-end;gap:.6rem;min-height:4.4rem}
.bip-row .slot{width:4.2rem;height:4.7rem;flex:none;display:grid;place-items:center}
.bip{width:100%;height:100%;cursor:pointer;filter:drop-shadow(0 10px 18px var(--tile-glow));transition:transform .15s;overflow:visible}
.bip:active{transform:scale(.92)}
.bip.bounce{animation:bipbounce .55s cubic-bezier(.3,1.6,.4,1)}
@keyframes bipbounce{0%{transform:translateY(0)}30%{transform:translateY(-14px) scaleX(.92)}60%{transform:translateY(0) scaleX(1.08) scaleY(.92)}100%{transform:none}}
.bip.dance{animation:dance 1.1s ease-in-out}
@keyframes dance{0%,100%{transform:none}15%{transform:translateY(-14px) rotate(-12deg)}30%{transform:translateY(0) rotate(0)}45%{transform:translateY(-14px) rotate(12deg)}60%{transform:translateY(0)}75%{transform:translateY(-8px) scale(1.06)}}
.bip.wiggle{animation:wiggle .6s ease-in-out}
@keyframes wiggle{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.bip.droop{animation:droop 1.4s ease-in-out}
@keyframes droop{30%,70%{transform:translateY(6px) scaleY(.94)}}
.bip .body{animation:idle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes idle{50%{transform:translateY(-2px) scaleX(1.02)}}
.bip .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.bip .pupils{transition:transform .18s ease-out}
.bip .mouth,.bip .browL,.bip .browR{transition:d .25s,transform .25s;transform-box:fill-box;transform-origin:center}
.bip.asleep .eyes{animation:none;transform:scaleY(.08)}
.bip.asleep .body{animation:snore 2.4s ease-in-out infinite}
@keyframes snore{50%{transform:translateY(2px) scale(1.04)}}
.bip.robot .eyes{display:none}
.bubble{position:relative;background:var(--panel);border-radius:1rem;padding:.55rem .8rem;font-weight:600;line-height:1.3;font-size:.92rem;box-shadow:0 10px 24px var(--tile-glow);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s,transform .25s;flex:1;cursor:pointer;min-height:2.4rem}
.bubble.show{opacity:1;transform:none}
.bubble::before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--panel);border-left:0}
.bubble small{display:block;font-weight:400;color:var(--soft);margin-top:.15rem;font-size:.82rem}
.bubble .act{display:inline-block;margin:.4rem .4rem 0 0;border:0;border-radius:.6rem;padding:.4rem .7rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.bubble .act.alt{background:var(--op);color:var(--op-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.tile{height:clamp(3.8rem,12dvh,5.6rem);border:0;border-radius:var(--radius);background:var(--tile);box-shadow:0 6px 0 var(--tile-edge),0 12px 24px var(--tile-glow);font-size:clamp(1.6rem,5.5dvh,2.3rem);font-weight:800;font-variant-numeric:tabular-nums;transform:translateY(0);transition:transform .12s,box-shadow .12s,background-color .2s,color .2s}
.tile:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 var(--tile-edge),0 6px 14px var(--tile-glow)}
.tile[aria-pressed="true"]{background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 6px 0 hsl(var(--hue) 70% 38%),0 14px 28px var(--tile-glow)}
.tile.gone{visibility:hidden}
.tile.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.tile.shake{animation:shake .4s}
.tile.in{animation:tilein .45s cubic-bezier(.3,1.5,.5,1) both}
.op.in{animation:tilein .4s cubic-bezier(.3,1.5,.5,1) both}
@keyframes tilein{0%{opacity:0;transform:translateY(18px) scale(.7)}100%{opacity:1;transform:none}}
.tile.hint,.op.hint{outline:3px solid var(--star);outline-offset:2px;animation:hintglow 1s ease-in-out 3}
@keyframes hintglow{50%{box-shadow:0 6px 0 var(--tile-edge),0 0 0 8px hsl(45 100% 60% / .35)}}
@keyframes pop{0%{transform:scale(.6);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.ghost{position:fixed;border-radius:var(--radius);background:var(--tile);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1.6rem,5.5dvh,2.3rem);box-shadow:0 14px 28px var(--tile-glow);z-index:8;pointer-events:none}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
.op{height:3rem;border:0;border-radius:var(--radius-s);background:var(--op);color:var(--op-ink);font-size:1.6rem;font-weight:600;line-height:1;transition:transform .12s,background-color .2s,color .2s}
.op:active{transform:scale(.92)}
.op[aria-pressed="true"]{background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 10px 24px var(--tile-glow)}
.actions{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:.55rem}
.btn{height:3.1rem;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel);font-weight:700;font-size:.95rem;transition:transform .12s,opacity .2s;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-size:1rem;box-shadow:0 12px 28px var(--tile-glow);line-height:1.15}
.btn.primary small{display:block;font-size:.78rem;font-weight:500;opacity:.9}
.btn.wide{grid-column:1 / -1}
/* Styles de boutons (loterie) */
:root[data-btn="pill"]{--radius:999px;--radius-s:999px}
:root[data-btn="square"]{--radius:.45rem;--radius-s:.4rem}
:root[data-btn="glass"] .tile,:root[data-btn="glass"] .op,:root[data-btn="glass"] .btn:not(.primary),:root[data-btn="glass"] .big.alt,:root[data-btn="glass"] .sq{background:rgba(255,255,255,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.55)}
:root[data-btn="glass"] .tile{box-shadow:0 6px 0 rgba(255,255,255,.35),0 14px 30px var(--tile-glow)}
:root[data-btn="neon"] .tile,:root[data-btn="neon"] .op,:root[data-btn="neon"] .btn:not(.primary){background:transparent;border:2px solid var(--accent);color:var(--accent);box-shadow:0 0 14px var(--tile-glow),inset 0 0 14px var(--tile-glow)}
:root[data-btn="neon"] .tile[aria-pressed="true"],:root[data-btn="neon"] .op[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Cartes et écrans secondaires */
.card{text-align:center;padding:.2rem 0 0}
.card h2{margin:0;font-size:1.15rem;font-weight:600;color:var(--soft)}
.total{margin:.1rem 0 0;font-size:clamp(3.6rem,12dvh,5.2rem);font-weight:800;line-height:1;letter-spacing:-.05em;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:bounce .8s cubic-bezier(.3,1.5,.4,1) both}
.total small{font-size:1.5rem;font-weight:600;letter-spacing:0;-webkit-text-fill-color:var(--soft);color:var(--soft)}
@keyframes bounce{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.rstars{margin:.5rem 0 0;font-size:1.7rem;letter-spacing:.06em;line-height:1.3}
.rstars .on{animation:earn .6s cubic-bezier(.3,1.6,.4,1) both}
.stats{display:flex;justify-content:center;gap:1.4rem;margin:.7rem 0 0;color:var(--soft);font-weight:600;flex-wrap:wrap;font-size:.9rem}
.stats b{display:block;color:var(--ink);font-size:1.35rem;font-weight:800;line-height:1.1}
.reward{margin:.7rem auto 0;max-width:20rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:.5rem .8rem;text-align:left;font-weight:600;color:var(--soft);font-size:.9rem}
.reward div{display:flex;justify-content:space-between;gap:1rem;padding:.1rem 0}
.reward div b{color:var(--coin)}
.reward .tot{border-top:1px solid var(--line);margin-top:.25rem;padding-top:.3rem;color:var(--ink)}
.card .btn.primary{margin-top:.8rem;width:100%;height:3.3rem}
.card .btn.ghostb{margin-top:.5rem;width:100%}
.card[data-anim] > *{animation:cardin .5s cubic-bezier(.2,.8,.2,1) both}
.card[data-anim] > *:nth-child(2){animation-delay:.08s}.card[data-anim] > *:nth-child(3){animation-delay:.16s}.card[data-anim] > *:nth-child(4){animation-delay:.24s}.card[data-anim] > *:nth-child(5){animation-delay:.32s}.card[data-anim] > *:nth-child(6){animation-delay:.4s}.card[data-anim] > *:nth-child(7){animation-delay:.48s}
@keyframes cardin{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
.next{margin:.6rem 0 0;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums;font-size:.9rem}
.intro p{color:var(--soft);margin:.5rem auto 0;max-width:22rem}
.flystar{position:fixed;z-index:12;pointer-events:none;color:var(--star);font-size:1.6rem;line-height:1;text-shadow:0 0 12px hsl(45 100% 60% / .8)}
body.quake{animation:quake .45s}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-1px)}}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:10;pointer-events:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-weight:800;font-size:1.8rem;padding:.6rem 1.4rem;border-radius:1.2rem;opacity:0;box-shadow:0 20px 50px var(--tile-glow);letter-spacing:-.02em;text-align:center}
.banner.go{animation:banner 1.3s cubic-bezier(.3,1.4,.4,1) both}
.banner.boss{background:linear-gradient(135deg,#7C4DFF,#FF3DAB)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}
.wipe{position:fixed;inset:0;z-index:15;pointer-events:none;display:grid;place-items:center;visibility:hidden;--dur:1300ms}
.wipe .panel{position:absolute;inset:-25%;background:linear-gradient(135deg,var(--accent),var(--accent-2));transform:translateX(-135%) skewX(-12deg)}
.wipe .panel.two{background:linear-gradient(135deg,var(--accent-2),hsl(calc(var(--hue) + 80) 90% 60%));opacity:.85}
.wipe .wtext{position:relative;text-align:center;color:var(--accent-ink);opacity:0;transform:scale(.6)}
.wipe .wtext span{display:block;font-weight:600;font-size:1.2rem;opacity:.9}
.wipe .wtext b{display:block;font-size:clamp(4.5rem,26vw,6.5rem);font-weight:800;line-height:1;letter-spacing:-.05em;text-shadow:0 10px 40px rgba(0,0,0,.25)}
.wipe.go{visibility:visible}
.wipe.go .panel{animation:sweep var(--dur) cubic-bezier(.7,0,.3,1) both}
.wipe.go .panel.two{animation-delay:calc(var(--dur) * .06)}
.wipe.go .wtext{animation:wtext var(--dur) ease-out both}
@keyframes sweep{0%{transform:translateX(-135%) skewX(-12deg)}38%{transform:translateX(0) skewX(-12deg)}62%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(135%) skewX(-12deg)}}
@keyframes wtext{0%,26%{opacity:0;transform:scale(.6) translateY(20px)}42%,66%{opacity:1;transform:scale(1) translateY(0)}80%,100%{opacity:0;transform:scale(1.15) translateY(-20px)}}

/* Listes (boutique, trophées, profil) */
.sect{margin:.5rem 0 .3rem;font-size:.95rem;font-weight:700;color:var(--soft)}
.item{display:flex;align-items:center;gap:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:.6rem .75rem;margin-bottom:.45rem;box-shadow:0 6px 16px rgba(0,0,0,.05)}
.item .ic{width:2.8rem;height:2.8rem;border-radius:.8rem;display:grid;place-items:center;font-size:1.35rem;background:var(--op);color:var(--op-ink);flex:none}
.item .sw{width:2.8rem;height:2.8rem;border-radius:50%;flex:none;position:relative}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:.98rem}
.item .tx span{display:block;color:var(--soft);font-size:.85rem;line-height:1.3}
.item .tx em{font-style:normal;color:var(--coin);font-weight:700}
.item.locked{opacity:.6}
.rar{display:inline-block;font-size:.72rem;font-weight:800;padding:.1rem .45rem;border-radius:.4rem;color:#fff;vertical-align:middle;margin-left:.3rem;text-transform:none}
.rar.bronze{background:var(--bronze)}.rar.silver{background:var(--silver);color:#1B1740}.rar.gold{background:var(--gold);color:#1B1740}.rar.diamond{background:var(--diamond);color:#0B2E4A}
.buy{border:0;border-radius:.75rem;padding:.5rem .75rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);white-space:nowrap;flex:none;font-size:.9rem}
.buy.own{background:var(--op);color:var(--op-ink)}
.buy:disabled{opacity:.45}
.redeem{display:flex;gap:.5rem;margin-top:.3rem}
.redeem input{flex:1;min-width:0;border:2px solid var(--line);border-radius:.8rem;padding:.55rem .75rem;background:var(--panel);color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
.note{color:var(--soft);font-size:.85rem;margin:.4rem 0 0;line-height:1.4}
.scroll{overflow-y:auto;flex:1;min-height:0;padding-bottom:.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.4rem .8rem;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.locked{opacity:.45}
textarea.code{width:100%;min-height:4.5rem;border:2px solid var(--line);border-radius:.8rem;padding:.5rem .7rem;background:var(--panel);color:var(--ink);font-size:.8rem;word-break:break-all;resize:vertical}
input.name{width:100%;border:2px solid var(--line);border-radius:.8rem;padding:.6rem .8rem;background:var(--panel);color:var(--ink);font-weight:700;font-size:1.05rem}

/* Roulette */
.wheelwrap{position:relative;display:grid;place-items:center;padding:.3rem 0}
.wheelwrap canvas{width:min(78vw,17rem);height:min(78vw,17rem);border-radius:50%;box-shadow:0 20px 50px var(--tile-glow),0 0 0 6px var(--panel),0 0 0 8px var(--line)}
.needle{position:absolute;top:-.1rem;left:50%;transform:translateX(-50%);width:0;height:0;border-left:.9rem solid transparent;border-right:.9rem solid transparent;border-top:1.6rem solid var(--ink);filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));z-index:2}
.prize{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:.9rem;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.12);animation:cardin .5s both}
.prize .pic{font-size:2.6rem;line-height:1}
.prize b{display:block;font-size:1.15rem;margin-top:.3rem}
.prize span{color:var(--soft);font-weight:600;font-size:.9rem}
.prize.bronze{border-color:var(--bronze);box-shadow:0 0 30px rgba(205,127,50,.45)}
.prize.silver{border-color:var(--silver);box-shadow:0 0 30px rgba(159,180,199,.55)}
.prize.gold{border-color:var(--gold);box-shadow:0 0 36px rgba(255,193,7,.6)}
.prize.diamond{border-color:var(--diamond);box-shadow:0 0 44px rgba(125,227,255,.75)}
.odds{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;font-size:.82rem;font-weight:700}

/* Trophées */
.troph{display:flex;align-items:center;gap:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:.55rem .7rem;margin-bottom:.4rem}
.troph .cup{width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;font-size:1.3rem;background:var(--op);flex:none}
.troph.done .cup{background:linear-gradient(135deg,var(--gold),#FF8F00)}
.troph .tx{flex:1;min-width:0}
.troph .tx b{display:block;font-size:.95rem}
.troph .tx span{display:block;color:var(--soft);font-size:.82rem}
.troph .rw{font-size:.85rem;font-weight:800;text-align:right;white-space:nowrap}
.troph .prog{height:.3rem;background:var(--line);border-radius:999px;margin-top:.25rem;overflow:hidden}
.troph .prog i{display:block;height:100%;background:var(--accent);width:0}

/* Feuille */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:24rem;background:var(--panel);border-radius:1.4rem;padding:1.1rem;box-shadow:0 30px 60px rgba(0,0,0,.3);transform:translateY(20px) scale(.97);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.scrim.show .sheet{transform:none}
.sheet h3{margin:0;font-size:1.2rem;font-weight:800}
.sheet p{margin:.4rem 0 0;color:var(--soft);font-weight:600}
.sheet .row{display:grid;gap:.5rem;margin-top:.9rem}
.toast{position:fixed;left:50%;top:calc(1rem + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:1rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Relief, lumière, effets ===== */
.light{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(260px circle at var(--lx,50%) var(--ly,35%),hsl(var(--hue) 95% 72% / .30),transparent 70%);mix-blend-mode:screen;opacity:0;transition:opacity .5s}
.light.on{opacity:1}
.tiles{perspective:900px}
.tile{position:relative;overflow:hidden;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(var(--tz,0)) translateY(var(--ty,0));transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background-color .2s,color .2s;will-change:transform}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 42%,rgba(0,0,0,.06) 100%);pointer-events:none}
.tile:active{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(4px) scale(.98)}
.tile[aria-pressed="true"]{--tz:16px;box-shadow:0 10px 0 hsl(var(--hue) 70% 36%),0 22px 40px var(--tile-glow)}
.tile.in{animation:tileflip .6s cubic-bezier(.3,1.4,.4,1) both}
@keyframes tileflip{0%{opacity:0;transform:perspective(700px) rotateX(-95deg) translateY(24px)}60%{opacity:1}100%{opacity:1;transform:perspective(700px) rotateX(0) translateY(0)}}
.op,.btn,.big,.buy,.chip{position:relative;overflow:hidden}
.sq{position:relative;overflow:visible}
.op::after,.btn::after,.big::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,.35),rgba(255,255,255,0) 50%);pointer-events:none}
.btn.primary,.big:not(.alt){box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 0 hsl(var(--hue) 70% 36%),0 14px 30px var(--tile-glow)}
.btn.primary:active,.big:not(.alt):active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 hsl(var(--hue) 70% 36%),0 8px 18px var(--tile-glow)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none;mix-blend-mode:screen}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.tnum{text-shadow:0 1px 0 hsl(var(--hue) 70% 42%),0 2px 0 hsl(var(--hue) 70% 38%),0 3px 0 hsl(var(--hue) 70% 34%),0 4px 0 hsl(var(--hue) 70% 30%),0 8px 18px rgba(0,0,0,.28),0 0 40px var(--tile-glow)}
@keyframes breathe{50%{text-shadow:0 1px 0 hsl(var(--hue) 70% 42%),0 2px 0 hsl(var(--hue) 70% 38%),0 3px 0 hsl(var(--hue) 70% 34%),0 4px 0 hsl(var(--hue) 70% 30%),0 8px 18px rgba(0,0,0,.28),0 0 70px var(--tile-glow),0 0 20px var(--tile-glow)}}
.slot{position:relative}
.slot::after{content:"";position:absolute;left:18%;right:18%;bottom:-.15rem;height:.55rem;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(4px);z-index:-1;animation:shadowpulse 3.2s ease-in-out infinite}
@keyframes shadowpulse{50%{transform:scaleX(.9);opacity:.75}}
.stage{perspective:800px}
.stage .slot{transform:rotateX(var(--px,0deg)) rotateY(var(--py,0deg));transition:transform .25s ease-out;transform-style:preserve-3d}
.decor{transition:transform .3s}
body.combo::before{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px var(--tile-glow);z-index:7;animation:pulseglow 1.1s ease-in-out infinite}
@keyframes pulseglow{50%{box-shadow:inset 0 0 60px var(--tile-glow)}}
.wipe .lines{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0 1.5deg,transparent 1.5deg 8deg);opacity:0;animation:spinlines var(--dur) linear both}
@keyframes spinlines{0%{opacity:0;transform:rotate(0) scale(.6)}35%{opacity:.7}65%{opacity:.7}100%{opacity:0;transform:rotate(80deg) scale(1.4)}}
.wipe .ring{position:absolute;width:20vmax;height:20vmax;border-radius:50%;border:6px solid rgba(255,255,255,.75);opacity:0;animation:ringout var(--dur) ease-out both}
.wipe .ring.r2{animation-delay:calc(var(--dur) * .12)}
@keyframes ringout{0%,35%{opacity:0;transform:scale(.2)}45%{opacity:.9}90%,100%{opacity:0;transform:scale(4)}}
.bag{display:flex;gap:.45rem;overflow-x:auto;padding:.1rem 0;scrollbar-width:none}

.bagi{flex:none;display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.35rem .7rem;font-weight:700;font-size:.85rem;box-shadow:0 4px 12px rgba(0,0,0,.06);position:relative;overflow:hidden}
.bagi:disabled{opacity:.4}
.bagi b{color:var(--coin)}
.strip{display:flex;gap:.5rem;align-items:center;justify-content:center;flex:1}
.strip .cur{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.25rem .65rem;font-size:.9rem;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.row4{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.row4 .sq{padding:.55rem .1rem .45rem;font-size:.68rem}
.row4 .sq .ico{font-size:1.35rem}
.board{display:flex;flex-direction:column;gap:.35rem}
.brow{display:flex;align-items:center;gap:.6rem;background:var(--panel);border:1px solid var(--line);border-radius:.9rem;padding:.55rem .7rem;font-weight:700}
.brow.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--tile-glow)}
.brow .rk{width:1.8rem;text-align:center;font-weight:800;color:var(--soft)}
.brow .rk.top{color:var(--gold)}
.brow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .nm small{display:block;color:var(--soft);font-weight:600;font-size:.78rem}
.brow .sc{text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
.acc input{margin-bottom:.35rem}
.chest-ico.ready{animation:chestshake 1.6s ease-in-out infinite}
@keyframes chestshake{0%,60%,100%{transform:none}65%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}85%{transform:rotate(-6deg)}}
.sheet p{white-space:pre-line}
.sheet p svg{width:1.1em;height:1.1em;vertical-align:-.2em}
.sheet.win{border:2px solid var(--gold);box-shadow:0 0 50px rgba(255,193,7,.45),0 30px 60px rgba(0,0,0,.3)}
.shopTabs{display:flex;gap:.4rem;overflow-x:auto;padding:.1rem 0 .3rem;scrollbar-width:none}
.shopTabs::-webkit-scrollbar{display:none}
.shopTabs .chip{flex:none}
/* ===== Profil et réglages ===== */
.pro{display:flex;align-items:center;gap:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.75rem .85rem;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.05)}
.pro .slot{width:4.4rem;height:4.9rem;flex:none}
.pro-who{flex:1;min-width:0}
.pname{width:100%;border:0;border-bottom:2px dashed var(--line);background:transparent;color:var(--ink);font-weight:800;font-size:1.2rem;padding:.15rem 0;border-radius:0}
.pname:focus{outline:none;border-bottom-color:var(--accent)}
.pro-lvl{display:block;color:var(--soft);font-weight:700;font-size:.88rem;margin-top:.25rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.55rem 0 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;padding:.5rem .25rem;text-align:center}
.stat b{display:block;font-size:1rem;font-weight:800;line-height:1.1}
.stat span{display:block;font-size:.68rem;color:var(--soft);font-weight:700;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-top:.7rem;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.05)}
.grp h3{margin:0;padding:.75rem .9rem .5rem;font-size:1rem;font-weight:800;display:flex;gap:.55rem;align-items:center}
.grp h3 .gi{width:1.75rem;height:1.75rem;border-radius:.55rem;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));font-size:.95rem;flex:none}
.row{display:flex;align-items:center;gap:.7rem;width:100%;padding:.8rem .9rem;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-weight:700;font-size:.95rem;color:var(--ink);border-radius:0;box-shadow:none}
.row::after{display:none}
.row .ri{width:1.6rem;text-align:center;font-size:1.1rem;flex:none}
.row .rl{flex:1;min-width:0}
.row .rv{color:var(--soft);font-weight:600;font-size:.9rem;max-width:45%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--soft);font-size:1.4rem;line-height:1;transition:transform .2s;flex:none}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.row.red{color:var(--bad)}
.pick{padding:.25rem .9rem .85rem;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:.4rem;background:var(--bg)}
.pick .chip{font-size:.88rem;padding:.4rem .75rem}
.pick .chip.more{border-style:dashed;color:var(--soft)}
.sw{width:3rem;height:1.75rem;border-radius:999px;border:0;background:var(--line);position:relative;transition:background-color .2s;flex:none;padding:0;overflow:visible}
.sw i{position:absolute;top:.2rem;left:.2rem;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{left:1.45rem}
.segl{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:.8rem;padding:.2rem;gap:.2rem;flex:1}
.segl button{flex:1;border:0;border-radius:.6rem;padding:.5rem;font-weight:700;background:transparent;color:var(--soft)}
.segl button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.rnote{margin:0;padding:0 .9rem .6rem;color:var(--soft);font-size:.85rem;font-weight:500;line-height:1.35}
@media (prefers-reduced-motion:reduce){
  .blob,.pt,.tnum,.tnum.roll,.tnum.hit,.node.earn .on,.node.cur b,.tile.pop,.tile.shake,.tile.in,.op.in,.tile.hint,.op.hint,.total,.rstars .on,.home .logo h1,.bip .body,.bip .eyes,.bip.bounce,.bip.dance,.bip.wiggle,.bip.droop,.bip.asleep .body,.banner.go,.flash.go,.bar.low i,.bump,.float,.card[data-anim] > *,body.quake,.wipe.go .panel,.wipe.go .wtext,.decor,.screen.enter,.prize,.ripple,.slot::after,body.combo::before,.wipe .lines,.wipe .ring,.chest-ico.ready{animation:none !important}
  .tile,.op,.btn,.toast,.bubble,.hbubble,.bip .pupils,.scrim,.sheet,body,.big,.sq{transition:none}
}

}

    if (!pool.length) pool = cands.filter(([v]) => v >= lo && v <= hi && v > above);
    if (!pool.length) pool = cands.filter(([v]) => v > above);

  const nums = [...small, pick([10,11,12,13,14,15,16,18,20,24]), pick(boss ? [50,75,100] : [25,50,75,100])];
  const choose = chooser(reachable(nums, rnd, boss ? 2500 : 1500), rnd);

function solve(nums, target){
  const memo = new Set(); let budget = 80000;
  function rec(arr, path){
    if (arr.includes(target)) return path;
    if (arr.length < 2 || budget-- < 0) return null;
    const key = arr.slice().sort((a,b)=>a-b).join(","); if (memo.has(key)) return null; memo.add(key);
    for (let i = 0; i < arr.length; i++) for (let j = 0; j < arr.length; j++){
      if (i === j) continue;
      for (const o of OPS){
        const r = apply(arr[i], o.k, arr[j]); if (r === null || r > 9999) continue;
        const rest = arr.filter((_, k) => k !== i && k !== j); rest.push(r);
        const res = rec(rest, path.concat([{a: arr[i], op: o.k, b: arr[j], r}])); if (res) return res;
      }
    }
    return null;
  }
  return rec(nums.slice(), []);
}

  const box = $("prizeBox"); box.hidden = false; box.innerHTML = "";
  const card = document.createElement("div"); card.className = "prize " + p.rar;
  const pic = document.createElement("div"); pic.className = "pic"; pic.textContent = prizeIcon(p);
  const b = document.createElement("b"); b.textContent = prizeName(p); const s = document.createElement("span"); s.textContent = `${T.ru.won}  ${T.rarity[p.rar]}${p.item ? "  " + T.ru.newItem : ""}`;
  card.append(pic, b, s); box.appendChild(card);
  const c = centerOf(card); burst(c.x, c.y, p.rar === "diamond" ? 160 : p.rar === "gold" ? 110 : 60, p.rar === "diamond" ? 190 : p.rar === "gold" ? 45 : 14);
  if (p.rar === "gold" || p.rar === "diamond"){ Snd.fanfare(); flash(); Bip.line2("jackpot", "laugh", 3600); } else Snd.buy();
  renderRoulette(); setTimeout(checkAch, 800);
}

// ===== Trophées =====
function renderTrophies(){
  $("trTitle").textContent = T.tr.title; $("trNote").textContent = T.tr.note; const host = $("trophyList"); host.innerHTML = "";
  ACH.forEach(a => {
    const done = wallet.ach.includes(a.id); const val = Math.min(a.need, a.get(wallet.c));
    const it = document.createElement("div"); it.className = "troph" + (done ? " done" : "");
    const cup = document.createElement("div"); cup.className = "cup"; cup.textContent = done ? "🏆" : "🔒";
    const tx = document.createElement("div"); tx.className = "tx"; const b = document.createElement("b"); b.textContent = T.ach[a.id][0]; b.insertAdjacentHTML("beforeend", rarBadge(a.rar));
    const sp = document.createElement("span"); sp.textContent = T.ach[a.id][1] + (a.need > 1 ? `  (${nf(val)}/${nf(a.need)})` : ""); tx.append(b, sp);
    if (a.need > 1 && !done){ const pr = document.createElement("div"); pr.className = "prog"; const i = document.createElement("i"); i.style.width = (val / a.need * 100) + "%"; pr.appendChild(i); tx.appendChild(pr); }
    const rw = document.createElement("div"); rw.className = "rw"; rw.textContent = (a.tix ? `${a.tix} 🎟 ` : "") + (a.gems ? `${a.gems} ◆` : "");
    it.append(cup, tx, rw); host.appendChild(it);
  });
  renderCurrencies();
}

// ===== Profil =====
function renderProfile(){
  $("prTitle").textContent = T.pr.title; $("pName").value = wallet.name || ""; $("pName").placeholder = T.pr.ph;
  $("pLvl").textContent = `${T.lvl} ${wallet.level}  ${titleFor(wallet.level)}  ·  ${wallet.xp}/${xpNeed(wallet.level)} ${T.xp}`.replace("  ·  ", "   "); $("pXpFill").style.width = Math.min(100, wallet.xp / xpNeed(wallet.level) * 100) + "%";
  const st = store.get("kalku:stats") || { streak: 0, played: 0, bestTime: null }; const bb = store.get("kalku:blitz") || { level: 0, score: 0 };
  const ps = $("pStats"); ps.innerHTML = "";
  [[st.played, T.pr.played], [st.streak, T.streak], [st.bestTime ? fmtTime(st.bestTime) : "–", T.pr.bestTime], [bb.level ? `${T.lvl} ${bb.level}` : "–", T.pr.best]].forEach(([v, l]) => { const d = document.createElement("div"); d.className = "stat"; const b = document.createElement("b"); b.textContent = v; const sp = document.createElement("span"); sp.textContent = l; d.append(b, sp); ps.appendChild(d); });
  $("grpLook").textContent = T.pr.look; $("grpSound").textContent = T.pr.soundG; $("grpLang").textContent = T.pr.langG; $("grpSave").textContent = T.pr.saveG; $("grpDanger").textContent = T.pr.danger;
  const chips = (host, list, ownedList, current, names, onPick) => {
    host.innerHTML = "";
    list.filter(x => ownedList.includes(x.id)).forEach(x => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", String(current === x.id)); b.textContent = `${x.icon} ${names[x.id]}`; b.addEventListener("click", () => { onPick(x.id); renderProfile(); }); host.appendChild(b); });
    if (list.some(x => !ownedList.includes(x.id))){ const m = document.createElement("button"); m.type = "button"; m.className = "chip more"; m.textContent = `+ ${T.pr.more}`; m.addEventListener("click", () => { shopTab = "board"; go("shop"); }); host.appendChild(m); }
  };
  $("rlTheme").textContent = T.pr.themes; $("rvTheme").textContent = T.themes[wallet.theme]; chips($("pThemes"), THEMES, wallet.themes, wallet.theme, T.themes, id => { wallet.theme = id; saveWallet(); applyTheme(); Bip.line2("themeSet", "wow", 3000); });
  $("rlBtn").textContent = T.pr.buttons; $("rvBtn").textContent = T.btns[wallet.btn]; chips($("pButtons"), BTNS, wallet.btns, wallet.btn, T.btns, id => { wallet.btn = id; saveWallet(); applyBtn(); });
  $("rlMusic").textContent = T.pr.music; $("rvMusic").textContent = T.musics[wallet.music]; chips($("pMusic"), MUSICS, wallet.musics, wallet.music, T.musics, id => { wallet.music = id; saveWallet(); applyMusic(); });
  $("rlSkin").textContent = T.pr.skin; $("rvSkin").textContent = T.skins[wallet.skin];
  $("rlSound").textContent = T.pr.sound; $("pSound").setAttribute("aria-checked", String(Snd.on)); $("sndTest").querySelector(".rl").textContent = T.snd.test; $("rlMusicOn").textContent = T.pr.musicOn; $("pMusicOn").setAttribute("aria-checked", String(Music.on));
  document.querySelectorAll("#scr-profile [data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("prSaveNote").textContent = T.pr.saveNote; $("exportBtn").querySelector(".rl").textContent = T.pr.export; $("importBtn").querySelector(".rl").textContent = T.pr.import; $("importGo").textContent = T.pr.importGo; $("codeArea").placeholder = T.pr.import;
  $("resetBtn").querySelector(".rl").textContent = T.pr.reset; $("prFoot").textContent = `Kalku #${puzzleNo}`;
}
document.querySelectorAll("#scr-profile .row[data-pick]").forEach(r => r.addEventListener("click", () => { const box = $(r.dataset.pick); const open = box.hidden; document.querySelectorAll("#scr-profile .pick").forEach(p => { if (p.id !== "importBox") p.hidden = true; }); document.querySelectorAll("#scr-profile .row[data-pick]").forEach(x => x.setAttribute("aria-expanded", "false")); box.hidden = !open; r.setAttribute("aria-expanded", String(open)); Snd.tap(); }));
$("rowSkin").addEventListener("click", () => { shopTab = "skins"; go("shop"); });
$("pName").addEventListener("input", () => { wallet.name = $("pName").value.trim().slice(0, 16); saveWallet(); clearTimeout(window._pn); window._pn = setTimeout(() => Cloud.pushProfile(), 1500); });
$("pSound").addEventListener("click", () => { Snd.on = !Snd.on; store.set("kalku:sound", Snd.on); if (Snd.on){ Snd.ensure(); Snd.tap(); } renderProfile(); });
$("sndTest").addEventListener("click", () => {
  const was = Snd.on; Snd.on = true; unlockAudio(); const c = Snd.ctx; const m = $("sndMsg"); m.hidden = false;
  if (!c){ m.textContent = T.snd.none; Snd.on = was; return; }
  setTimeout(() => { if (c.state === "running"){ Snd.fanfare(); m.textContent = T.snd.ok; } else m.textContent = tpl(T.snd.ko, { s: c.state }); Snd.on = was; }, 150);
});
$("pMusicOn").addEventListener("click", () => { Music.toggle(); renderMusBtn(); if (Music.on){ Snd.ensure(); Music.start(); Bip.line2("music", "laugh", 2600); } renderProfile(); });
document.querySelectorAll("#scr-profile [data-lang]").forEach(b => b.addEventListener("click", () => { applyLang(b.dataset.lang); renderProfile(); }));
function exportCode(){ const data = { v: 1, w: wallet, s: store.get("kalku:stats"), b: store.get("kalku:blitz"), d: daily, m: dayMeta, snd: Snd.on, mus: Music.on, lang }; return btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/=+$/, ""); }
$("exportBtn").addEventListener("click", async () => { const code = exportCode(); const ta = $("codeArea"); $("importBox").hidden = false; ta.value = code; $("importGo").hidden = true; try{ await navigator.clipboard.writeText(code); toast(T.pr.exported); }catch(e){ ta.select(); } });
$("importBtn").addEventListener("click", () => { const ta = $("codeArea"); $("importBox").hidden = false; ta.value = ""; $("importGo").hidden = false; ta.focus(); });
$("importGo").addEventListener("click", async () => {
  try{
    const data = JSON.parse(decodeURIComponent(escape(atob($("codeArea").value.trim()))));
    if (!data || !data.w || !data.w.items) throw 0;
    const ok = await sheet(T.pr.importGo, T.pr.saveNote, T.pr.importGo, T.no); if (!ok) return;
    store.set("kalku:wallet", data.w); if (data.s) store.set("kalku:stats", data.s); if (data.b) store.set("kalku:blitz", data.b); if (data.d && data.d.idx !== undefined) store.set("kalku:day:" + today, data.d); if (data.m) store.set("kalku:daymeta:" + today, data.m);
    if (data.snd !== undefined) store.set("kalku:sound", data.snd); if (data.mus !== undefined) store.set("kalku:music", data.mus); if (data.lang) store.set("kalku:lang", data.lang);
    toast(T.pr.imported); setTimeout(() => location.reload(), 600);
  }catch(e){ toast(T.pr.badCode); Snd.bad(); }
});
$("resetBtn").addEventListener("click", async () => { const ok = await sheet(T.pr.resetAsk, T.pr.resetText, T.pr.reset, T.no); if (!ok) return; ["kalku:wallet","kalku:stats","kalku:blitz","kalku:seen","kalku:day:" + today, "kalku:daymeta:" + today].forEach(k => store.del(k)); location.reload(); });

// ===== Coffre du jour =====
const chestReady = () => wallet.chestDay !== today;
async function openChest(){
  if (!chestReady()) { toast(T.chest.opened); return; }
  const st = store.get("kalku:stats") || { streak: 0 }; const streak = Math.max(1, st.streak || 1);
  const coins = 30 + 10 * Math.min(10, streak); const tix = Math.random() < .2 + Math.min(.3, streak * .02) ? 1 : 0; const gems = Math.random() < .15 ? 1 : 0;
  wallet.chestDay = today; wallet.coins += coins; wallet.c.coinsEarned += coins; wallet.tickets += tix; wallet.gems += gems; saveWallet();
  Snd.fanfare(); confettiRain(70); const c = centerOf($("hChest")); burst(c.x, c.y, 80, 45); replay(Bip.el, "dance");
  const lines = [`+${coins} ◎`, `+${XP_CHEST} ${T.xp}`]; if (tix) lines.push(`+1 🎟`); if (gems) lines.push(`+1 ◆`);
  renderHome(); await sheet(T.chest.title, `${T.chest.got}\n${lines.join("\n")}`, T.lv.ok, "", true); addXp(XP_CHEST);
}
$("hChest").addEventListener("click", openChest);

// ===== Accueil =====
function renderHome(){
  $("hTag").textContent = T.home.tag; $("hName").textContent = wallet.name || (lang === "fr" ? "Joueur" : "Player"); $("hTitle").textContent = `${T.lvl} ${wallet.level}  ${titleFor(wallet.level)}`;
  const ring = $("hRing"); ring.dataset.lv = wallet.level; ring.style.setProperty("--p", Math.round(wallet.xp / xpNeed(wallet.level) * 100) + "%");
  $("hDailyT").textContent = T.home.daily; $("hDailySub").textContent = dailySub();
  const bb = store.get("kalku:blitz"); $("hBlitzT").textContent = T.home.blitz; $("hBlitzSub").textContent = bb && bb.level ? tpl(T.home.blitzSub, { l: bb.level, s: nf(bb.score) }) : T.home.blitzNew;
  $("hRouletteT").textContent = T.home.roulette; $("hShopT").textContent = T.home.shop; $("hTrophT").textContent = T.home.trophies; $("hBoardT").textContent = T.home.board; $("hFoot").textContent = T.home.foot;
  $("hChestT").textContent = chestReady() ? T.chest.ready : T.chest.opened; $("hChestIco").classList.toggle("ready", chestReady()); $("hChestBadge").hidden = !chestReady(); renderXp();
  const ready = ACH.filter(a => !wallet.ach.includes(a.id) && a.get(wallet.c) >= a.need).length; $("hTrophBadge").hidden = !ready; $("hTrophBadge").textContent = ready;
  const dec = $("hDecor"); dec.innerHTML = ""; DECORS.filter(d => wallet.decors.includes(d.id)).forEach((d, i) => { const s = document.createElement("span"); s.className = "decor"; s.textContent = d.icon; s.style.left = d.x; s.style.top = d.y; s.style.animationDelay = (i * .4) + "s"; s.title = T.decors[d.id]; dec.appendChild(s); });
  renderCurrencies();
}
["hDaily","hBlitz","hRoulette","hShop","hTroph","hBoard","hProfile","hSettings"].forEach(id => $(id).addEventListener("click", () => {
  if (id === "hDaily"){ if (canStartNext()) askNextGame(); else startDaily(); } else if (id === "hBlitz") startBlitzScreen(); else go(id === "hRoulette" ? "roulette" : id === "hShop" ? "shop" : id === "hTroph" ? "trophies" : id === "hBoard" ? "board" : "profile");
}));
$("gCoins").addEventListener("click", () => go("shop"));
$("sCoins").addEventListener("click", () => { shopTab = "items"; go("shop"); }); $("sGems").addEventListener("click", () => { shopTab = "packs"; go("shop"); }); $("sTix").addEventListener("click", () => go("roulette"));
function renderMusBtn(){ $("gMus").setAttribute("aria-pressed", String(Music.on)); }
$("gMus").addEventListener("click", () => { Music.toggle(); renderMusBtn(); if (Music.on){ Snd.ensure(); Music.start(); Bip.line2("music", "laugh", 2600); } });

// ===== Navigation =====
function go(id){
  document.body.classList.remove("combo"); $("light").classList.remove("on");
  if (screen === "game"){ if (blitz.running){ clearInterval(blitz.timer); blitz.running = false; applyMusic(); } if (mode === "daily" && startTs){ daily.elapsed += Date.now() - startTs; startTs = null; store.set("kalku:day:" + today, daily); } }
  screen = id; ["home","game","shop","roulette","trophies","profile","board"].forEach(s => { const el = $("scr-" + s); el.hidden = s !== id; if (s === id){ el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); } });
  if (Bip.bub) Bip.bub.classList.remove("show"); clearTimeout(Bip.timer);
  if (id === "game") Bip.mount("bipSlotGame", "bubble"); else if (id === "profile") Bip.mount("bipSlotProfile", "pBubble"); else Bip.mount("bipSlotHome", "hBubble");
  Music.setPart(id === "game" ? "daily" : (id === "shop" || id === "roulette") ? id : "home");
  if (id === "home") renderHome(); else if (id === "shop") renderShop(); else if (id === "roulette") renderRoulette(); else if (id === "trophies") renderTrophies(); else if (id === "profile"){ renderProfile(); renderAccount(); } else if (id === "board") renderRanking();
  try{ window.scrollTo(0, 0); }catch(e){} Snd.tap();
}
function startDaily(){ mode = "daily"; go("game"); dailyStart(); if (firstVisit && !dailyDone()){ firstVisit = false; store.set("kalku:seen", 1); setTimeout(() => Bip.sequence(T.bip.tutorial), 500); } else if (!dailyDone()) setTimeout(greet, 400); }
function startBlitzScreen(){ mode = "blitz"; go("game"); blitzIntro(); }
$("back").addEventListener("click", () => go("home"));
document.querySelectorAll(".icon.back").forEach(b => b.addEventListener("click", () => go("home")));
$("startBlitz").addEventListener("click", blitzStart); $("againBlitz").addEventListener("click", blitzStart);
$("goBlitz").addEventListener("click", () => { if (canStartNext()) askNextGame(); else startBlitzScreen(); });
async function shareOut(text){ try { if (navigator.share){ await navigator.share({ text }); return; } await navigator.clipboard.writeText(text); toast(T.copied); } catch(e){ try { await navigator.clipboard.writeText(text); toast(T.copied); } catch(_){ toast(text); } } }
$("share").addEventListener("click", () => shareOut(dailyShare())); $("shareBlitz").addEventListener("click", () => shareOut(blitzShare()));
Bip.mount("bipSlotHome", "hBubble");
$("hBubble").addEventListener("click", () => { if (!Bip.advance()) $("hBubble").classList.remove("show"); });
$("bubble").addEventListener("click", () => { if (!Bip.advance()) $("bubble").classList.remove("show"); });
function greet(){
  const h = new Date().getHours(), wk = [0,6].includes(new Date().getDay());
  if (wk && Math.random() < .3) return Bip.line2("weekend", "happy", 3600);
  if (h >= 5 && h < 11) return Bip.line2("morning", "happy", 3600);
  if (h >= 18 && h < 22) return Bip.line2("evening", "happy", 3600);
  if (h >= 22 || h < 5) return Bip.line2("night", "think", 3800);
  Bip.line("hello", "happy", 3600);
}
function applyLang(l){
  lang = l; T = I18N[l]; document.documentElement.lang = l; store.set("kalku:lang", l);
  if (screen === "home") renderHome(); else if (screen === "game"){ if (mode === "daily"){ if (dailyDone()) dailyFinish(false); else renderBoard(); } else { if (blitz.running){ renderBoard(); renderHud(); } else if (blitz.result && !$("blitzResult").hidden) renderBlitzResult(); else blitzIntro(); } renderMeta(); }
  else if (screen === "shop") renderShop(); else if (screen === "roulette") renderRoulette(); else if (screen === "trophies") renderTrophies(); else if (screen === "board") renderRanking(); else if (screen === "profile"){ renderProfile(); renderAccount(); }
  renderXp(); renderCurrencies();
}

saveWallet(); applySkin(); applyTheme(); applyBtn(); applyMusic(); renderXp(); applyLang(lang); go("home"); renderMusBtn(); Cloud.init();

else setTimeout(() => Bip.line2("homeIdle", "happy", 3400), 900);
setInterval(tick, 1000); resetIdle();

if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai$/.test(location.hostname)){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
