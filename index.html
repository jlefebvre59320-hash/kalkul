<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalku</title>
<meta name="description" content="Kalku : six nombres, trois cibles, quatre opérations. Un casse-tête quotidien sans mots, un mode Blitz, Bip, une roulette et des trophées.">
<meta property="og:title" content="Kalku">
<meta property="og:description" content="Six nombres, trois cibles, quatre opérations. Le même puzzle pour tout le monde, chaque jour.">
<meta name="theme-color" content="#2540FF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalku">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<style>
@property --hue { syntax:"<number>"; inherits:true; initial-value:14; }
:root{
  --hue:14;
  --bg:#FAF8FF; --panel:#FFFFFF; --ink:#1B1740; --soft:#6B6790; --line:#E6E3F3;
  --accent:hsl(var(--hue) 85% 52%); --accent-2:hsl(calc(var(--hue) + 40) 90% 56%); --accent-ink:#FFFFFF;
  --tile:#FFFFFF; --tile-edge:hsl(var(--hue) 70% 86%); --tile-glow:hsl(var(--hue) 70% 60% / .22);
  --op:hsl(var(--hue) 90% 95%); --op-ink:hsl(var(--hue) 70% 32%);
  --star:#FFB300; --star-off:#DCD9EA; --ok:#12B76A; --bad:#F04438; --focus:hsl(var(--hue) 85% 45%); --coin:#F5A524; --gem:#4FC3F7; --ticket:#FF7043;
  --blob-a:hsl(var(--hue) 95% 78%); --blob-b:hsl(calc(var(--hue) + 120) 90% 82%); --blob-c:hsl(calc(var(--hue) + 240) 90% 85%);
  --face:#1B1740; --scrim:rgba(27,23,64,.5); --radius:1.25rem; --radius-s:1rem;
  --bronze:#CD7F32; --silver:#9FB4C7; --gold:#FFC107; --diamond:#7DE3FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-board]){
    --bg:#0B0A1F; --panel:#171538; --ink:#F4F2FF; --soft:#A29FCB; --line:#2B2955;
    --accent:hsl(var(--hue) 85% 62%); --accent-2:hsl(calc(var(--hue) + 40) 90% 64%); --accent-ink:#0B0A1F;
    --tile:#1B1945; --tile-edge:hsl(var(--hue) 55% 24%); --tile-glow:hsl(var(--hue) 90% 55% / .35);
    --op:hsl(var(--hue) 50% 18%); --op-ink:hsl(var(--hue) 90% 80%);
    --star:#FFD54F; --star-off:#332F6B; --ok:#3ECF8E; --bad:#FF6B61; --focus:hsl(var(--hue) 85% 70%); --coin:#FFC64D;
    --blob-a:hsl(var(--hue) 90% 40%); --blob-b:hsl(calc(var(--hue) + 120) 80% 35%); --blob-c:hsl(calc(var(--hue) + 240) 80% 38%);
    --face:#0B0A1F; --scrim:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]:not([data-board]){
  --bg:#0B0A1F; --panel:#171538; --ink:#F4F2FF; --soft:#A29FCB; --line:#2B2955;
  --accent:hsl(var(--hue) 85% 62%); --accent-2:hsl(calc(var(--hue) + 40) 90% 64%); --accent-ink:#0B0A1F;
  --tile:#1B1945; --tile-edge:hsl(var(--hue) 55% 24%); --tile-glow:hsl(var(--hue) 90% 55% / .35);
  --op:hsl(var(--hue) 50% 18%); --op-ink:hsl(var(--hue) 90% 80%);
  --star:#FFD54F; --star-off:#332F6B; --ok:#3ECF8E; --bad:#FF6B61; --focus:hsl(var(--hue) 85% 70%); --coin:#FFC64D;
  --blob-a:hsl(var(--hue) 90% 40%); --blob-b:hsl(calc(var(--hue) + 120) 80% 35%); --blob-c:hsl(calc(var(--hue) + 240) 80% 38%);
  --face:#0B0A1F; --scrim:rgba(0,0,0,.62);
}
/* Thèmes de plateau (forcés, quel que soit le mode du téléphone) */
:root[data-board="ocean"]{--bg:#E3F6FF;--panel:#FFFFFF;--ink:#0B2E4A;--soft:#4F7A95;--line:#C9E6F5;--tile:#FFFFFF;--tile-edge:#9ADBF5;--tile-glow:rgba(0,150,220,.22);--op:#DDF3FF;--op-ink:#0B5F8A;--blob-a:#7FD3FF;--blob-b:#B3F0E0;--blob-c:#CFE9FF;--face:#0B2E4A;--star-off:#CFE3EE}
:root[data-board="sakura"]{--bg:#FFF0F5;--panel:#FFFFFF;--ink:#4A1F33;--soft:#9A5C77;--line:#F5D3E1;--tile:#FFFFFF;--tile-edge:#F7B8D2;--tile-glow:rgba(240,100,160,.22);--op:#FFE1EC;--op-ink:#A7325F;--blob-a:#FFB7D5;--blob-b:#FFE0B2;--blob-c:#E1BEE7;--face:#4A1F33;--star-off:#F0D6E1}
:root[data-board="forest"]{--bg:#F3EBDD;--panel:#FFF8EC;--ink:#3E2A14;--soft:#7A6247;--line:#E3D4BA;--tile:#F2DDB9;--tile-edge:#C89B5E;--tile-glow:rgba(120,80,20,.22);--op:#E4EFD8;--op-ink:#2E5A1E;--blob-a:#A5D6A7;--blob-b:#D7CCC8;--blob-c:#FFE0B2;--face:#3E2A14;--star-off:#E0D2BA}
:root[data-board="night"]{--bg:#0B0F1F;--panel:#141A33;--ink:#EAF0FF;--soft:#9AA6D6;--line:#26305A;--tile:#1A2142;--tile-edge:#2B3A80;--tile-glow:rgba(0,229,255,.35);--op:#1B2B4F;--op-ink:#7FF0FF;--accent:#00E5FF;--accent-2:#FF3DAB;--accent-ink:#0B0F1F;--blob-a:#00E5FF;--blob-b:#FF3DAB;--blob-c:#7C4DFF;--face:#0B0F1F;--scrim:rgba(0,0,0,.7);--coin:#FFD54F;--star-off:#2B3560;--focus:#00E5FF}
:root[data-board="retro"]{--bg:#000000;--panel:#111111;--ink:#E6FF6A;--soft:#9FB36B;--line:#333333;--tile:#1B1B1B;--tile-edge:#4A4A4A;--tile-glow:rgba(230,255,106,.25);--op:#1F2A12;--op-ink:#E6FF6A;--accent:#E6FF6A;--accent-2:#FF6AE6;--accent-ink:#000000;--blob-a:#1F3A1F;--blob-b:#3A1F3A;--blob-c:#1F1F3A;--face:#000000;--scrim:rgba(0,0,0,.75);--star:#FFE06A;--star-off:#3A3A3A;--coin:#FFE06A;--focus:#E6FF6A;--radius:.4rem;--radius-s:.35rem}
:root[data-board="royal"]{--bg:#1A0F2E;--panel:#2A1A4A;--ink:#FFF3D6;--soft:#C9B8E8;--line:#3F2B6E;--tile:#3A2565;--tile-edge:#7D5AA6;--tile-glow:rgba(255,193,7,.3);--op:#3B2A5F;--op-ink:#FFD54F;--accent:#FFC107;--accent-2:#FF8F00;--accent-ink:#1A0F2E;--blob-a:#FFC107;--blob-b:#7C4DFF;--blob-c:#4A148C;--face:#1A0F2E;--scrim:rgba(0,0,0,.7);--star-off:#4A3A70;--focus:#FFC107}
:root[data-board="galaxy"]{--bg:#05030F;--panel:#100A24;--ink:#EDE7FF;--soft:#A99BD9;--line:#241A4A;--tile:#160F33;--tile-edge:#3B2A7A;--tile-glow:rgba(124,77,255,.4);--op:#1B1240;--op-ink:#C9B8FF;--accent:#7C4DFF;--accent-2:#FF3DAB;--accent-ink:#FFFFFF;--blob-a:#7C4DFF;--blob-b:#FF3DAB;--blob-c:#1DE9B6;--face:#05030F;--scrim:rgba(0,0,0,.75);--star-off:#2A2050;--focus:#7C4DFF}
:root[data-board="night"] .blob,:root[data-board="galaxy"] .blob,:root[data-board="royal"] .blob{opacity:.5}
:root[data-board="retro"] .blob{opacity:.6;filter:blur(40px)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35;min-height:100dvh;overflow-x:hidden;transition:--hue .8s ease,background-color .5s}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none !important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* Fond vivant + particules */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.75;will-change:transform}
.b1{background:var(--blob-a);left:-25vmax;top:-30vmax;animation:drift1 22s ease-in-out infinite alternate}
.b2{background:var(--blob-b);right:-30vmax;top:20vh;animation:drift2 26s ease-in-out infinite alternate}
.b3{background:var(--blob-c);left:10vw;bottom:-40vmax;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,-12vh) scale(.9)}}
@keyframes drift3{to{transform:translate(-10vw,-18vh) scale(1.1)}}
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.pt{position:absolute;bottom:-10vh;left:var(--x);width:var(--s);height:var(--s);opacity:0;animation-duration:var(--d);animation-delay:var(--dl);animation-iteration-count:infinite;animation-timing-function:linear}
.pt.bubble{border-radius:50%;border:2px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(120,210,255,.2));animation-name:rise}
.pt.petal{border-radius:60% 0 60% 0;background:linear-gradient(135deg,#FFC1D9,#FF8FB8);top:-10vh;bottom:auto;animation-name:fall}
.pt.leaf{border-radius:0 60% 0 60%;background:linear-gradient(135deg,#8BC34A,#558B2F);top:-10vh;bottom:auto;animation-name:fall}
.pt.star{border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;top:var(--y);bottom:auto;animation-name:twinkle;animation-timing-function:ease-in-out}
.pt.sparkle{background:var(--accent);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);top:var(--y);bottom:auto;animation-name:twinkle}
.pt.grid{inset:0;left:0;bottom:0;width:100%;height:100%;opacity:.25;background:linear-gradient(transparent 95%,var(--accent) 95%) 0 0/100% 40px,linear-gradient(90deg,transparent 95%,var(--accent-2) 95%) 0 0/40px 100%;animation-name:gridmove;animation-timing-function:linear}
.pt.scan{inset:0;left:0;bottom:0;width:100%;height:100%;opacity:.18;background:repeating-linear-gradient(transparent 0 3px,rgba(230,255,106,.35) 3px 4px);animation-name:scanmove;animation-timing-function:linear}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}90%{opacity:.6}100%{transform:translateY(-115vh) translateX(6vw);opacity:0}}
@keyframes fall{0%{transform:translateY(0) rotate(0) translateX(0);opacity:0}10%{opacity:.95}50%{transform:translateY(55vh) rotate(180deg) translateX(8vw)}100%{transform:translateY(115vh) rotate(360deg) translateX(-6vw);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes gridmove{to{background-position:0 40px,40px 0}}
@keyframes scanmove{to{background-position:0 4px}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.flash{position:fixed;inset:0;pointer-events:none;z-index:8;background:var(--accent);opacity:0}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}

/* Écrans */
.screen{max-width:26rem;margin:0 auto;min-height:100dvh;padding:calc(.7rem + env(safe-area-inset-top)) .9rem calc(.8rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.55rem}
.screen.enter{animation:screenin .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenin{0%{opacity:0;transform:translateY(14px) scale(.98)}100%{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:2.6rem}
.topbar .mid{flex:1;text-align:center;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums;font-size:.95rem}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:.8rem;height:2.5rem;min-width:2.5rem;padding:0 .6rem;font-size:1rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.icon[aria-pressed="false"]{opacity:.55}
.cur{display:inline-flex;align-items:center;gap:.25rem;font-weight:800}
.cur.coins b{color:var(--coin)}.cur.gems b{color:var(--gem)}.cur.tix b{color:var(--ticket)}
.icon svg,.cur svg,.float svg{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em}
.cur b{display:inline-flex;align-items:center}
.strip .cur{cursor:pointer}
.coins.bump,.gems.bump,.tix.bump{animation:bump .5s cubic-bezier(.3,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.18)}}
.float{position:fixed;font-weight:800;color:var(--coin);pointer-events:none;z-index:11;animation:floatup 1.2s ease-out both;text-shadow:0 2px 10px rgba(0,0,0,.25)}
@keyframes floatup{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-40px) scale(1)}}

/* Accueil */
.home .logo{text-align:center;margin:.3rem 0 0}
.home .logo h1{margin:0;font-size:clamp(2.6rem,13vw,3.6rem);font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(90deg,var(--ink) 0 40%,var(--accent) 50%,var(--ink) 60% 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
.home .logo p{margin:.1rem 0 0;color:var(--soft);font-weight:600;font-size:.92rem}
.stage{position:relative;min-height:clamp(7.5rem,21dvh,9.5rem);display:flex;align-items:center;gap:.7rem;padding:.2rem .15rem}
#hDecor{position:absolute;inset:0;z-index:0;pointer-events:none}
.stage .slot{width:clamp(5.6rem,17dvh,7.4rem);height:clamp(6.2rem,19dvh,8.2rem);display:grid;place-items:center;filter:drop-shadow(0 18px 30px var(--tile-glow));flex:none;z-index:1}
.stage .slot .bip{width:100%;height:100%}
.decor{position:absolute;font-size:1.7rem;line-height:1;animation:hover 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
@keyframes hover{50%{transform:translateY(-6px)}}
.hbubble{position:relative;flex:1;z-index:2;background:var(--panel);border-radius:1.1rem;padding:.65rem .85rem;font-weight:600;font-size:.92rem;line-height:1.3;box-shadow:0 10px 24px var(--tile-glow);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s,transform .25s;text-align:left;min-height:2.6rem;cursor:pointer}
.hbubble::before{content:"";position:absolute;left:-8px;bottom:16px;border:8px solid transparent;border-right-color:var(--panel);border-left:0}
.hbubble.show{opacity:1;transform:none}
.pro .hbubble{position:absolute;top:-.7rem;left:5.6rem;right:.6rem;flex:none;z-index:3;font-size:.85rem;padding:.5rem .7rem}
.pro .hbubble::before{left:-8px;bottom:12px}
.pcard{display:flex;align-items:center;gap:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.55rem .75rem;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.pcard .ring{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem;color:var(--accent-ink);background:conic-gradient(var(--accent) var(--p,0%),var(--line) 0);position:relative;flex:none}
.pcard .ring::after{content:attr(data-lv);position:absolute;inset:.3rem;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center}
.pcard .who{flex:1;min-width:0}
.pcard .who b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .who span{color:var(--soft);font-size:.88rem;font-weight:600}
.pcard .wallet{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem;font-size:.92rem}
.menu{display:grid;gap:.55rem}
.big{display:flex;align-items:center;justify-content:space-between;gap:.6rem;border:0;border-radius:var(--radius);padding:.9rem 1rem;text-align:left;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 12px 28px var(--tile-glow);transition:transform .12s}
.big:active{transform:scale(.98)}
.big b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.big small{display:block;font-weight:600;opacity:.9;font-size:.9rem}
.big .ico{font-size:1.8rem;line-height:1}
.big.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.big.alt small{color:var(--soft)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.55rem}
.sq{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:.7rem .3rem .6rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:.3rem;box-shadow:0 8px 20px rgba(0,0,0,.06);transition:transform .12s;font-size:.9rem}
.sq:active{transform:scale(.97)}
.sq .ico{font-size:1.6rem;line-height:1}
.sq .badge{position:absolute;top:-.45rem;right:-.35rem;z-index:2;background:var(--ticket);color:#fff;border-radius:999px;min-width:1.4rem;height:1.4rem;display:grid;place-items:center;font-size:.8rem;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.foot{display:flex;justify-content:center;gap:.5rem;color:var(--soft);font-size:.85rem;font-weight:600}

/* Jeu : tout en un écran */
.game{gap:.4rem}
.xp{display:flex;align-items:center;gap:.5rem;font-weight:600;color:var(--soft);font-size:.85rem}
.xp .lv{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-radius:.6rem;padding:.1rem .5rem;font-weight:800;font-size:.85rem}
.xp .track{flex:1;height:.4rem;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.xp .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-weight:600;color:var(--soft);font-size:.9rem}
.hud b{color:var(--ink);font-size:1.1rem;font-weight:800}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem}
.bar{height:.5rem;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .1s linear;border-radius:999px}
.bar.low i{background:var(--bad);animation:blinkbar .5s steps(2) infinite}
@keyframes blinkbar{to{opacity:.55}}
.target{text-align:center;padding:0}
.tlabel{margin:0;color:var(--soft);font-weight:600;font-size:.9rem}
.tnum{margin:0;font-size:clamp(3.4rem,11dvh,5.6rem);font-weight:800;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 40px var(--tile-glow);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{text-shadow:0 0 70px var(--tile-glow),0 0 20px var(--tile-glow)}}
.tnum.roll{animation:roll .5s cubic-bezier(.2,.8,.2,1),breathe 3s ease-in-out .5s infinite}
.tnum.hit{color:var(--ok);animation:hitpulse .6s ease-out}
@keyframes roll{from{transform:translateY(.35em) scale(.9);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
@keyframes hitpulse{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
.path{display:flex;align-items:flex-start;justify-content:center;margin:.1rem auto 0;max-width:14rem}
.node{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-weight:800}
.node b{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);color:var(--soft);font-size:.9rem;transition:background-color .3s,color .3s,transform .3s}
.node:not(:first-child)::before{content:"";position:absolute;left:-50%;right:50%;top:.9rem;height:3px;background:var(--line);z-index:-1}
.node.done::before,.node.cur::before{background:linear-gradient(90deg,var(--accent-2),var(--accent))}

.bip-row{display:flex;align-items:flex-end;gap:.6rem;min-height:4.4rem}

@keyframes snore{50%{transform:translateY(2px) scale(1.04)}}

.bubble{position:relative;background:var(--panel);border-radius:1rem;padding:.55rem .8rem;font-weight:600;line-height:1.3;font-size:.92rem;box-shadow:0 10px 24px var(--tile-glow);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s,transform .25s;flex:1;cursor:pointer;min-height:2.4rem}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.tile{height:clamp(3.8rem,12dvh,5.6rem);border:0;border-radius:var(--radius);background:var(--tile);box-shadow:0 6px 0 var(--tile-edge),0 12px 24px var(--tile-glow);font-size:clamp(1.6rem,5.5dvh,2.3rem);font-weight:800;font-variant-numeric:tabular-nums;transform:translateY(0);transition:transform .12s,box-shadow .12s,background-color .2s,color .2s}
.tile:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 var(--tile-edge),0 6px 14px var(--tile-glow)}

@keyframes hintglow{50%{box-shadow:0 6px 0 var(--tile-edge),0 0 0 8px hsl(45 100% 60% / .35)}}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.ghost{position:fixed;border-radius:var(--radius);background:var(--tile);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1.6rem,5.5dvh,2.3rem);box-shadow:0 14px 28px var(--tile-glow);z-index:8;pointer-events:none}

/* Styles de boutons (loterie) */
:root[data-btn="pill"]{--radius:999px;--radius-s:999px}

:root[data-btn="glass"] .tile,:root[data-btn="glass"] .op,:root[data-btn="glass"] .btn:not(.primary),:root[data-btn="glass"] .big.alt,:root[data-btn="glass"] .sq{background:rgba(255,255,255,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.55)}

/* Cartes et écrans secondaires */
.card{text-align:center;padding:.2rem 0 0}

@keyframes bounce{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

.card[data-anim] > *:nth-child(2){animation-delay:.08s}.card[data-anim] > *:nth-child(3){animation-delay:.16s}.card[data-anim] > *:nth-child(4){animation-delay:.24s}.card[data-anim] > *:nth-child(5){animation-delay:.32s}.card[data-anim] > *:nth-child(6){animation-delay:.4s}.card[data-anim] > *:nth-child(7){animation-delay:.48s}
@keyframes cardin{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
.next{margin:.6rem 0 0;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums;font-size:.9rem}
.intro p{color:var(--soft);margin:.5rem auto 0;max-width:22rem}
.flystar{position:fixed;z-index:12;pointer-events:none;color:var(--star);font-size:1.6rem;line-height:1;text-shadow:0 0 12px hsl(45 100% 60% / .8)}

.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:10;pointer-events:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-weight:800;font-size:1.8rem;padding:.6rem 1.4rem;border-radius:1.2rem;opacity:0;box-shadow:0 20px 50px var(--tile-glow);letter-spacing:-.02em;text-align:center}

.banner.boss{background:linear-gradient(135deg,#7C4DFF,#FF3DAB)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}
.wipe{position:fixed;inset:0;z-index:15;pointer-events:none;display:grid;place-items:center;visibility:hidden;--dur:1300ms}
.wipe .panel{position:absolute;inset:-25%;background:linear-gradient(135deg,var(--accent),var(--accent-2));transform:translateX(-135%) skewX(-12deg)}
.wipe .panel.two{background:linear-gradient(135deg,var(--accent-2),hsl(calc(var(--hue) + 80) 90% 60%));opacity:.85}

@keyframes sweep{0%{transform:translateX(-135%) skewX(-12deg)}38%{transform:translateX(0) skewX(-12deg)}62%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(135%) skewX(-12deg)}}
@keyframes wtext{0%,26%{opacity:0;transform:scale(.6) translateY(20px)}42%,66%{opacity:1;transform:scale(1) translateY(0)}80%,100%{opacity:0;transform:scale(1.15) translateY(-20px)}}

/* Listes (boutique, trophées, profil) */
.sect{margin:.5rem 0 .3rem;font-size:.95rem;font-weight:700;color:var(--soft)}
.item{display:flex;align-items:center;gap:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:.6rem .75rem;margin-bottom:.45rem;box-shadow:0 6px 16px rgba(0,0,0,.05)}

/* Roulette */
.wheelwrap{position:relative;display:grid;place-items:center;padding:.3rem 0}
.wheelwrap canvas{width:min(78vw,17rem);height:min(78vw,17rem);border-radius:50%;box-shadow:0 20px 50px var(--tile-glow),0 0 0 6px var(--panel),0 0 0 8px var(--line)}
.needle{position:absolute;top:-.1rem;left:50%;transform:translateX(-50%);width:0;height:0;border-left:.9rem solid transparent;border-right:.9rem solid transparent;border-top:1.6rem solid var(--ink);filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));z-index:2}

.odds{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;font-size:.82rem;font-weight:700}

/* Trophées */
.troph{display:flex;align-items:center;gap:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:.55rem .7rem;margin-bottom:.4rem}
.troph .cup{width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;font-size:1.3rem;background:var(--op);flex:none}

.troph .tx{flex:1;min-width:0}
.troph .tx b{display:block;font-size:.95rem}

.troph .prog i{display:block;height:100%;background:var(--accent);width:0}

/* Feuille */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:24rem;background:var(--panel);border-radius:1.4rem;padding:1.1rem;box-shadow:0 30px 60px rgba(0,0,0,.3);transform:translateY(20px) scale(.97);transition:transform .25s cubic-bezier(.2,.8,.2,1)}

.sheet h3{margin:0;font-size:1.2rem;font-weight:800}

.sheet .row{display:grid;gap:.5rem;margin-top:.9rem}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Relief, lumière, effets ===== */
.light{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(260px circle at var(--lx,50%) var(--ly,35%),hsl(var(--hue) 95% 72% / .30),transparent 70%);mix-blend-mode:screen;opacity:0;transition:opacity .5s}
.light.on{opacity:1}
.tiles{perspective:900px}
.tile{position:relative;overflow:hidden;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(var(--tz,0)) translateY(var(--ty,0));transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background-color .2s,color .2s;will-change:transform}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 42%,rgba(0,0,0,.06) 100%);pointer-events:none}
.tile:active{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(4px) scale(.98)}
.tile[aria-pressed="true"]{--tz:16px;box-shadow:0 10px 0 hsl(var(--hue) 70% 36%),0 22px 40px var(--tile-glow)}
.tile.in{animation:tileflip .6s cubic-bezier(.3,1.4,.4,1) both}
@keyframes tileflip{0%{opacity:0;transform:perspective(700px) rotateX(-95deg) translateY(24px)}60%{opacity:1}100%{opacity:1;transform:perspective(700px) rotateX(0) translateY(0)}}
.op,.btn,.big,.buy,.chip{position:relative;overflow:hidden}
.sq{position:relative;overflow:visible}

const WEDGES = [ { kind:"coins", icon:"◎" }, { kind:"skin", icon:"🎩" }, { kind:"theme", icon:"🎨" }, { kind:"gems", icon:"◆" }, { kind:"music", icon:"🎵" }, { kind:"decor", icon:"🪴" }, { kind:"buttons", icon:"🔘" }, { kind:"consumable", icon:"⭐" } ];
const wheel = { angle: 0, spinning: false };

function weightedRarity(){ const tot = Object.values(RARITY).reduce((a, r) => a + r.w, 0); let x = Math.random() * tot; for (const [k, r] of Object.entries(RARITY)){ if ((x -= r.w) <= 0) return k; } return "bronze"; }

const LET_ROUNDS = 10, LET_ROUND_MS = 45000, LET_MIN = 3, LRUN_KEY = "kalku:lblitzrun";
const HUES_LET = [40, 300, 150, 45];
const LETTERS = { fr: { v: "AAAAAAAAAEEEEEEEEEEEEEEEIIIIIIIIOOOOOOUUUUUUY", c: "BBCCDDDFFGGHHJKLLLLLMMMNNNNNNPPPQRRRRRRRSSSSSSSTTTTTTVVWXZ" }, en: { v: "AAAAAAAAAEEEEEEEEEEEEIIIIIIIIIOOOOOOOOUUUUY", c: "BBCCDDDDFFGGGHHJKLLLLMMNNNNNNPPQRRRRRRSSSSSSTTTTTTVVWWXYZ" } };
function drawLetters(rnd, L){ const a = LETTERS[L] || LETTERS.fr; const nv = 3 + Math.floor(rnd() * 3); const out = []; for (let i = 0; i < nv; i++) out.push(a.v[Math.floor(rnd() * a.v.length)]); for (let i = 0; i < 9 - nv; i++) out.push(a.c[Math.floor(rnd() * a.c.length)]); for (let i = out.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; } return out; }
const lseriesCache = {};
function lseriesFor(day, L){ const k = day + "|" + L; if (lseriesCache[k]) return lseriesCache[k]; const out = []; for (let j = 0; j < LET_ROUNDS; j++) out.push(drawLetters(mulberry32(hash(`${day}#L${L}#${j}`)), L)); lseriesCache[k] = out; return out; }
const Dict = {
  lang: null, set: null, byLen: null, loading: null,
  async load(L){
    if (this.lang === L && this.set) return true; if (this.loading) return this.loading;
    this.loading = (async () => { try{ const r = await fetch(L === "fr" ? "mots-fr.txt" : "words-en.txt"); if (!r.ok) throw 0; const arr = (await r.text()).split("\n").filter(Boolean); this.set = new Set(arr); this.byLen = {}; arr.forEach(w => { (this.byLen[w.length] = this.byLen[w.length] || []).push(w); }); this.lang = L; return true; }catch(e){ return false; } finally { this.loading = null; } })();
    return this.loading;
  },
  best(letters){ if (!this.byLen) return ""; const counts = {}; letters.forEach(l => counts[l] = (counts[l] || 0) + 1); for (let n = 9; n >= LET_MIN; n--){ for (const w of (this.byLen[n] || [])) if (canBuild(w, counts)) return w; } return ""; }
};
function canBuild(w, counts){ const c = Object.assign({}, counts); for (const ch of w){ if (!c[ch]) return false; c[ch]--; } return true; }
const dictReady = () => !!(Dict.set && Dict.lang === lang);

// --- état ---
const newLDaily = () => ({ day: today, lang, idx: 0, words: Array(LET_ROUNDS).fill(null), bests: Array(LET_ROUNDS).fill(""), points: 0, errors: 0, moves: 0, elapsed: 0, rewarded: false, resumed: false });
let ldaily = store.get("kalku:lday:" + today + ":" + lang); if (!ldaily || ldaily.day !== today || ldaily.lang !== lang) ldaily = newLDaily();
if (ldaily.idx > 0 && ldaily.idx < LET_ROUNDS) ldaily.resumed = true;
const saveLDaily = () => store.set("kalku:lday:" + today + ":" + lang, ldaily);
const ldailyDone = () => ldaily.idx >= LET_ROUNDS;
const LB = { letters: [], order: [], compose: [], endAt: 0, timer: null, active: false, busy: false, startAt: 0 };
const lblitz = { running: false, startAt: 0, endAt: 0, points: 0, words: 0, errors: 0, lastMs: 0, timer: null, result: null, day: today, warned: false, x2: false };
const lmode = () => mode === "lblitz" ? lblitz : null;
const lActive = () => screen === "game" && game === "let" && LB.active && (mode === "ldaily" ? !ldailyDone() : lblitz.running);

// --- rendu ---
function lRender(fresh){
  $("ltlabel").textContent = mode === "ldaily" ? `${T.let.draw} ${ldaily.idx + 1}/${LET_ROUNDS}` : `${T.let.draw} ${lblitz.words + 1}`;
  const tl = $("ltiles"); tl.innerHTML = "";
  LB.order.forEach((li, k) => { const b = document.createElement("button"); b.type = "button"; b.className = "ltile" + (LB.compose.includes(li) ? " used" : "") + (fresh ? " in" : ""); if (fresh) b.style.animationDelay = (k * 40) + "ms"; b.textContent = LB.letters[li]; b.disabled = !LB.active || LB.busy || LB.compose.includes(li); b.addEventListener("click", () => lTap(li)); tl.appendChild(b); });
  const c = $("compose"); c.innerHTML = "";
  if (!LB.compose.length){ const p = document.createElement("span"); p.className = "ph"; p.textContent = T.let.composeHint; c.appendChild(p); }
  LB.compose.forEach((li, k) => { const s = document.createElement("span"); s.className = "cl"; s.textContent = LB.letters[li]; s.addEventListener("click", () => { if (!LB.active || LB.busy) return; LB.compose.splice(k); lRender(); Snd.tap(); }); c.appendChild(s); });
  $("lclear").textContent = T.let.clear; $("lshuffle").textContent = T.let.shuffle; $("lsubmit").textContent = `${T.let.submit}${LB.compose.length ? " · " + LB.compose.length : ""}`.replace(" · ", "  "); $("lsubmit").disabled = !LB.active || LB.busy || LB.compose.length < LET_MIN;
  $("lclear").disabled = !LB.active || LB.busy || !LB.compose.length; $("lshuffle").disabled = !LB.active || LB.busy;
  lRenderBag();
}
function lRenderBag(){ const bag = $("lbag"); bag.innerHTML = ""; const add = (label, count, fn, en) => { const b = document.createElement("button"); b.type = "button"; b.className = "bagi"; b.textContent = label; if (count !== null){ const c = document.createElement("b"); c.textContent = "×" + count; b.appendChild(c); } b.disabled = !en; if (fn) b.addEventListener("click", fn); bag.appendChild(b); }; add(`💡 ${T.let.hintFree}`, null, () => lHint(false), LB.active && !LB.busy); if (wallet.items.hint) add(`💡 ${T.bag.useHint}`, wallet.items.hint, () => lHint(true), LB.active && !LB.busy); if (mode === "lblitz" && wallet.items.hourglass) add(`⏭ ${T.bag.hourglass}`, wallet.items.hourglass, lSkip, LB.active && !LB.busy); }
function lTick(){
  if (!LB.active) return; const left = (mode === "lblitz" ? lblitz.endAt : LB.endAt) - Date.now(); const total = mode === "ldaily" ? LET_ROUND_MS : BLITZ_DURATION;
  $("lbarFill").style.width = Math.max(0, left / total * 100) + "%"; $("lbar").classList.toggle("low", left <= (mode === "ldaily" ? 10000 : 30000));
  if (mode === "lblitz"){ $("timeV").textContent = fmtClock(left); $("barFill").style.width = Math.max(0, left / BLITZ_DURATION * 100) + "%"; $("bar").classList.toggle("low", left <= 30000); $("lvl").textContent = lblitz.points; $("scoreV").textContent = lblitz.words; if (left <= 30000 && !lblitz.warned){ lblitz.warned = true; Bip.line2("lowTime", "wow", 2200); } }
  else $("lreveal").textContent = fmtClock(left);
  if (left <= 0){ if (mode === "ldaily") lRoundEnd(null); else lBlitzEnd(); }
}
function lSetDraw(letters, fresh){ LB.letters = letters.slice(); LB.order = letters.map((_, i) => i); LB.compose = []; LB.busy = false; lRender(fresh !== false); }

// --- interactions ---
function lTap(li){ if (!lActive() || LB.busy || LB.compose.includes(li)) return; LB.compose.push(li); Snd.tap(); const el = [...$("ltiles").children][LB.order.indexOf(li)]; if (el){ const c = centerOf(el); spark(c.x, c.y, 6, HUES_LET[1]); } lRender(); }
$("lclear").addEventListener("click", () => { if (!lActive() || LB.busy) return; LB.compose = []; Snd.tap(); lRender(); });
$("lshuffle").addEventListener("click", () => { if (!lActive() || LB.busy) return; for (let i = LB.order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [LB.order[i], LB.order[j]] = [LB.order[j], LB.order[i]]; } Snd.tap(); lRender(true); });
$("lsubmit").addEventListener("click", () => lSubmit());
function lSubmit(){
  if (!lActive() || LB.busy || LB.compose.length < LET_MIN) return;
  const w = LB.compose.map(li => LB.letters[li]).join("");
  if (!Dict.set || !Dict.set.has(w)){ Snd.bad(); buzz([40,30,40]); $("compose").querySelectorAll(".cl").forEach(el => replay(el, "shake")); if (mode === "ldaily"){ ldaily.errors++; saveLDaily(); } else { lblitz.errors++; lBlitzSave(); } wallet.c.errors++; saveWallet(); Bip.say(tpl(rand(T.let.refused), { w }), "sad", 2600); LB.compose = []; lRender(); return; }
  Snd.exact(); buzz([30,40,60]); const c = centerOf($("compose")); burst(c.x, c.y, 30 + w.length * 6, HUES_LET[w.length >= 7 ? 3 : 0]);
  if (w.length >= 7) wallet.c.longWord7 = (wallet.c.longWord7 || 0) + 1; if (w.length >= 9) wallet.c.word9 = (wallet.c.word9 || 0) + 1; saveWallet();
  if (mode === "ldaily") lRoundEnd(w); else lBlitzWord(w);
}
async function lHint(useToken){
  if (!lActive() || LB.busy) return; if (useToken && wallet.items.hint < 1) useToken = false;
  const best = Dict.best(LB.letters); if (!best){ Bip.say(T.let.noWord, "sad", 3000); return; }
  if (useToken){ wallet.items.hint--; saveWallet(); } else if (mode === "ldaily"){ ldaily.capped = true; saveLDaily(); } else { lblitz.endAt -= HINT_COST * 1000; lBlitzSave(); }
  const shown = best.slice(0, Math.max(2, Math.ceil(best.length / 2))) + "…"; Bip.say(tpl(T.let.hint, { n: best.length, s: shown }), "wow", 5000, useToken ? T.hintToken : (mode === "ldaily" ? T.let.hintCap : T.hintCost)); Snd.hint(); lRenderBag();
}

// --- défi du jour lettres ---
async function lDailyStart(){
  setHue(HUES_LET[Math.min(Math.floor(ldaily.idx / 4), 2)]); showOnly("lboard"); $("lreveal").textContent = ""; $("dictload").hidden = true;
  if (ldailyDone()){ lFinish(false); return; }
  if (!dictReady()){ $("dictload").hidden = false; $("dictload").textContent = T.let.loading; LB.active = false; lSetDraw(lseriesFor(today, lang)[ldaily.idx], false); const ok = await Dict.load(lang); if (screen !== "game" || game !== "let") return; if (!ok){ $("dictload").textContent = T.let.noDict; return; } $("dictload").hidden = true; }
  lRoundStart();
}
function lRoundStart(){
  const letters = lseriesFor(today, lang)[ldaily.idx]; LB.active = true; LB.startAt = Date.now(); LB.endAt = LB.startAt + LET_ROUND_MS; lSetDraw(letters, true); renderMeta();
  clearInterval(LB.timer); LB.timer = setInterval(lTick, 200); lTick();
  if (ldaily.idx === 0 && !(wallet.taught || {}).let){ wallet.taught = wallet.taught || {}; wallet.taught.let = true; saveWallet(); setTimeout(() => Bip.say(T.let.rules, "happy", 7000), 500); }
  else if (Math.random() < .5) setTimeout(() => { if (LB.active && !Bip.seq) Bip.say(rand(T.let.start), "think", 3200); }, 700);
}
async function lRoundEnd(word){
  if (!LB.active) return; LB.active = false; LB.busy = true; clearInterval(LB.timer);
  const used = Math.min(LET_ROUND_MS, Date.now() - LB.startAt); ldaily.elapsed += used;
  const best = Dict.best(LB.letters); ldaily.bests[ldaily.idx] = best; ldaily.words[ldaily.idx] = word || "";
  if (word){ let pts = word.length; if (ldaily.capped){ pts = Math.ceil(pts / 2); ldaily.capped = false; } ldaily.points += pts; ldaily.moves++; } ldaily.capped = false; saveLDaily();
  const r = $("lreveal"); r.textContent = ""; const b = document.createElement("b"); b.textContent = word ? `${word}  +${word.length}` : T.let.timeout; const sm = document.createElement("small"); sm.textContent = best ? tpl(T.let.best, { w: best, n: best.length }) : ""; r.append(b, sm);
  if (word && best && word.length >= best.length){ Bip.say(rand(T.let.perfectRound), "laugh", 3000); confettiRain(40); } else if (word && word.length >= 7) Bip.say(rand(T.let.good), "laugh", 3000); else if (word) Bip.say(tpl(rand(T.let.better), { n: best.length }), "think", 3000); else Bip.say(rand(T.let.missed), "sad", 3000);
  lRender();
  await new Promise(res => setTimeout(res, 2600));
  ldaily.idx++; saveLDaily(); Cloud.pushSeries(lModeKey("ldaily"), lDailyEntry(false), true); renderMeta();
  if (ldailyDone()){ lFinish(true); return; }
  await wipe(`${T.let.draw} ${ldaily.idx + 1}/${LET_ROUNDS}`, "Aa", 1100, () => { setHue(HUES_LET[Math.min(Math.floor(ldaily.idx / 4), 2)]); $("lreveal").textContent = ""; });
  lRoundStart();
}
const lModeKey = base => base + "_" + lang;
const lDailyEntry = completed => ({ day: today, mode: lModeKey("ldaily"), successes: ldaily.points, errors: ldaily.errors, moves: ldaily.moves, time: ldaily.elapsed, completed, resumed: ldaily.resumed, name: wallet.name || "" });
function lFinish(fresh){
  setHue(HUES_LET[3]); if (screen !== "game") return; clearInterval(LB.timer); LB.active = false;
  const optimum = ldaily.bests.reduce((a, b) => a + (b ? b.length : 0), 0);
  let st = store.get("kalku:lstats") || { last: null, streak: 0, played: 0 };
  if (st.last !== today){ st.streak = st.last === yesterday ? st.streak + 1 : 1; st.played += 1; st.last = today; store.set("kalku:lstats", st); }
  let rw = ldaily.reward;
  if (!ldaily.rewarded){
    rw = { pts: ldaily.points, bonus: ldaily.words.every(w => w && w.length >= 5) ? 100 : 0, streak: Math.min(COIN_STREAK_CAP, 5 * st.streak), tix: optimum && ldaily.points >= optimum ? 1 : 0 };
    rw.total = rw.pts + rw.bonus + rw.streak; rw.xp = Math.round((ldaily.points * 2 + (rw.bonus ? XP_PERFECT : 0) + XP_STREAK) * Math.min(2, 1 + .1 * (st.streak - 1)));
    ldaily.reward = rw; ldaily.rewarded = true; saveLDaily();
    wallet.coins += rw.total; wallet.c.coinsEarned += rw.total; wallet.c.ldailies = (wallet.c.ldailies || 0) + 1; wallet.tickets += rw.tix; saveWallet();
    histPut(lDailyEntry(true)); Cloud.pushSeries(lModeKey("ldaily"), lDailyEntry(true)); Cloud.save(true);
    if (fresh) setTimeout(() => addXp(rw.xp), 2400); else addXp(rw.xp); setTimeout(checkAch, fresh ? 4500 : 300);
  }
  showOnly("dailyResult"); if (fresh) $("dailyResult").dataset.anim = "1"; else delete $("dailyResult").dataset.anim;
  $("rtitle").textContent = T.let.done; $("rtotal").textContent = ldaily.points; $("rtotal").nextElementSibling.textContent = " " + T.pts;
  const rs = $("rstars"); rs.innerHTML = ""; rs.className = "words"; ldaily.words.forEach((w, j) => { const sp = document.createElement("span"); const best = ldaily.bests[j]; if (!w){ sp.className = "miss"; sp.textContent = best || "—"; } else { sp.textContent = w; if (best && w.length >= best.length) sp.className = "best"; } rs.appendChild(sp); });
  $("rtime").textContent = fmtTime(ldaily.elapsed); $("rtimel").textContent = T.time;
  $("streak").textContent = `✗ ${ldaily.errors}`; $("streakl").textContent = T.und.errors;
  $("played").textContent = `${ldaily.moves}/${LET_ROUNDS}`; $("playedl").textContent = T.let.wordsFound;
  const box = $("rewardBox"); box.innerHTML = "";
  const row = (l, v, color) => { const r = document.createElement("div"); const a = document.createElement("span"); a.textContent = l; const b = document.createElement("b"); b.textContent = v; if (color) b.style.color = color; r.append(a, b); return r; };
  if (rw){ box.appendChild(row(T.let.ptsLabel, `+${rw.pts} ◎`)); if (rw.bonus) box.appendChild(row(T.let.bonus5, `+${rw.bonus} ◎`)); if (rw.streak) box.appendChild(row(T.rwStreak, `+${rw.streak} ◎`)); const t = row(T.rwTotal, `+${rw.total} ◎`); t.className = "tot"; box.appendChild(t); if (rw.xp) box.appendChild(row(T.rwXp, `+${rw.xp} ${T.xp}`, "var(--accent)")); if (rw.tix) box.appendChild(row(T.ru.title, `+${rw.tix} 🎟`, "var(--ticket)")); }
  const rk = $("rankBox"); rk.innerHTML = ""; rk.hidden = false;
  [[T.let.ptsLabel, `${ldaily.points}`], [T.let.optimum, `${optimum}`], [T.let.wordsFound, `${ldaily.moves}/${LET_ROUNDS}`], [T.und.errors, ldaily.errors], [T.time, fmtTime(ldaily.elapsed)]].forEach(([l, v]) => { const r = row(l, v); r.lastChild.style.color = "var(--ink)"; rk.appendChild(r); });
  if (ldaily.resumed){ const r = row(T.ser.resumed, "✓"); r.lastChild.style.color = "var(--soft)"; rk.appendChild(r); }
  $("share").textContent = T.share; $("goBlitz").textContent = T.ser.rank; $("nextl").textContent = T.ser.next;
  if (fresh){ Snd.level(); setTimeout(() => { const c = centerOf($("rtotal")); burst(c.x, c.y, 130, HUES_LET[3]); }, 250); if (rw && rw.tix) confettiRain(160); if (rw) setTimeout(() => { floatAt($("gCoins"), `+${rw.total} ◎`); Snd.coin(); Bip.line("coins", "laugh", 4200); }, 1600); }
  renderMeta(); tick();
}
function lShare(){ const opt = ldaily.bests.reduce((a, b) => a + (b ? b.length : 0), 0); const row = ldaily.words.map(w => w ? (ldaily.bests[ldaily.words.indexOf(w)] && w.length >= ldaily.bests[ldaily.words.indexOf(w)].length ? "🟩" : "🟨") : "⬜").join(""); return `Lettra #${puzzleNo}  ${ldaily.points} ${T.pts} (${T.let.optimum.toLowerCase()} ${opt})  ✗${ldaily.errors}  ⏱ ${fmtTime(ldaily.elapsed)}\n${row}\n${SHARE_URL || location.origin + location.pathname}`; }

// --- Blitz lettres : 5 minutes, un nouveau tirage par mot ---

  LB.active = true; lSetDraw(drawLetters(Math.random, lang), true); lBlitzSave(); Music.setPart("blitz"); Bip.line("blitzStart", "wow", 2600); Snd.level();

}
function lBlitzSave(){ if (!lblitz.running) return; store.set(LRUN_KEY, { day: lblitz.day, lang, startAt: lblitz.startAt, endAt: lblitz.endAt, points: lblitz.points, words: lblitz.words, errors: lblitz.errors, lastMs: lblitz.lastMs, x2: lblitz.x2, letters: LB.letters }); }

  lblitz.points += w.length; lblitz.words++; lblitz.lastMs = Date.now() - lblitz.startAt; banner(`${w}  +${w.length}`); lBlitzSave();

}
function lSkip(){ if (!lActive() || LB.busy || wallet.items.hourglass < 1) return; wallet.items.hourglass--; saveWallet(); Snd.buy(); banner(T.bz.skip); lSetDraw(drawLetters(Math.random, lang), true); lBlitzSave(); }
const lBlitzEntry = () => ({ day: lblitz.day, mode: lModeKey("lblitz"), successes: lblitz.points, errors: lblitz.errors, moves: lblitz.words, time: lblitz.lastMs, completed: true, name: wallet.name || "" });

const CODE_ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function friendCode(uid, salt){ let h = hash(uid + "|" + (salt || 0)), out = ""; for (let i = 0; i < 6; i++){ out += CODE_ALPHA[h % CODE_ALPHA.length]; h = Math.floor(h / CODE_ALPHA.length) ^ (h * 7 + i); h = Math.abs(h) >>> 0; if (h < 31) h = hash(out + i); } return out.slice(0, 3) + "-" + out.slice(3); }
const normCode = c => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^(.{3})(.{3})$/, "$1-$2");
Object.assign(Cloud, {
  friends: { accepted: [], incoming: [], outgoing: [], profiles: {} },
  async ensureCode(){
    if (!this.user) return null; if (wallet.friendCode && wallet.friendCodeUid === this.user.id) return wallet.friendCode;
    try{ const { data } = await this.sb.from("profiles").select("code").eq("id", this.user.id).maybeSingle(); if (data && data.code){ wallet.friendCode = data.code; wallet.friendCodeUid = this.user.id; saveWallet(); return data.code; } }catch(e){}
    for (let salt = 0; salt < 8; salt++){ const code = friendCode(this.user.id, salt); const { error } = await this.sb.from("profiles").upsert({ id: this.user.id, code, name: wallet.name || null, skin: wallet.skin, level: wallet.level, updated_at: new Date().toISOString() }); if (!error){ wallet.friendCode = code; wallet.friendCodeUid = this.user.id; saveWallet(); return code; } }
    return null;
  },
  async lookupCode(code){ const { data } = await this.sb.from("profiles").select("id,name,level").eq("code", normCode(code)).maybeSingle(); return data || null; },
  async addFriend(code){
    if (!this.user) throw new Error("account"); const target = await this.lookupCode(code); if (!target) throw new Error("notfound"); if (target.id === this.user.id) throw new Error("self");
    const { data: rows } = await this.sb.from("friends").select("user_id,friend_id,status").or(`and(user_id.eq.${this.user.id},friend_id.eq.${target.id}),and(user_id.eq.${target.id},friend_id.eq.${this.user.id})`);
    const rel = (rows || [])[0];
    if (rel && rel.status === "accepted") throw new Error("already");
    if (rel && rel.user_id === target.id){ await this.acceptFriend(target.id); return { accepted: true, target }; }
    if (rel) throw new Error("pending");
    const { error } = await this.sb.from("friends").insert({ user_id: this.user.id, friend_id: target.id, status: "pending" }); if (error) throw error; return { accepted: false, target };
  },
  async acceptFriend(otherId){ const { error } = await this.sb.from("friends").update({ status: "accepted" }).eq("user_id", otherId).eq("friend_id", this.user.id); if (error) throw error; },
  async removeFriend(otherId){ await this.sb.from("friends").delete().or(`and(user_id.eq.${this.user.id},friend_id.eq.${otherId}),and(user_id.eq.${otherId},friend_id.eq.${this.user.id})`); },
  async loadFriends(){
    if (!this.user) return this.friends; const me = this.user.id;
    const { data: rows } = await this.sb.from("friends").select("user_id,friend_id,status").or(`user_id.eq.${me},friend_id.eq.${me}`);
    const acc = [], inc = [], out = []; (rows || []).forEach(r => { const other = r.user_id === me ? r.friend_id : r.user_id; if (r.status === "accepted") acc.push(other); else if (r.friend_id === me) inc.push(other); else out.push(other); });
    const ids = [...new Set([...acc, ...inc, ...out])]; const profiles = {};
    if (ids.length){ const { data: ps } = await this.sb.from("profiles").select("id,name,level,skin").in("id", ids); (ps || []).forEach(p => profiles[p.id] = p); }
    this.friends = { accepted: acc, incoming: inc, outgoing: out, profiles }; return this.friends;
  },
  async friendScores(day, modeName, ids){ if (!ids.length) return []; const { data } = await this.sb.from("series_scores").select("user_id,name,level,successes,errors,moves,time_ms,completed,score").eq("day", day).eq("mode", modeName).in("user_id", ids); return (data || []).map(r => ({ ...r, time: r.time_ms })); },
  async consumeInvite(){ const code = store.get("kalku:invite"); if (!code || !this.user) return; store.del("kalku:invite"); try{ const r = await this.addFriend(code); toast(r.accepted ? tpl(T.fr_.added, { n: r.target.name || "?" }) : tpl(T.fr_.requestSent, { n: r.target.name || "?" })); Snd.buy(); }catch(e){ if (e.message !== "already" && e.message !== "pending") toast(T.fr_.notFound); } }
});

  body.appendChild(sect(tpl(T.fr_.list, { n: F.accepted.length })));
  if (!F.accepted.length){ const p = document.createElement("p"); p.className = "note"; p.textContent = T.fr_.none; body.appendChild(p); }
  else {
    let todayNum = [], todayLet = []; try{ todayNum = await Cloud.friendScores(today, "daily", F.accepted); todayLet = await Cloud.friendScores(today, lModeKey("ldaily"), F.accepted); }catch(e){}
    F.accepted.forEach(id => { const n = todayNum.find(r => r.user_id === id), l = todayLet.find(r => r.user_id === id); const sc = document.createElement("span"); sc.className = "sc"; sc.style.maxWidth = "42%"; [[n ? `${n.successes}/${SERIES_LEN} ✓` : null, "num"], [l ? `${l.successes} ${T.pts}` : null, "let"]].forEach(([t, k]) => { if (!t) return; const s = document.createElement("span"); s.textContent = (k === "num" ? "6 " : "Aa ") + t; sc.appendChild(s); }); if (!sc.children.length){ const s = document.createElement("span"); s.textContent = T.fr_.notToday; s.style.background = "transparent"; s.style.color = "var(--soft)"; sc.appendChild(s); }
      body.appendChild(row(id, [sc, btn("✕", "own", async () => { const ok = await sheet(T.fr_.removeTitle, "", T.fr_.remove, T.no); if (!ok) return; await Cloud.removeFriend(id); toast(T.fr_.removed); renderFriends(); })])); });
